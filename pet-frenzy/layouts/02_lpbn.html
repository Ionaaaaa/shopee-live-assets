<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>02 直播大廳 LPBN</title>
<style>:root{ --cw:1125px; --ch:360px; }</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1125" height="360"></canvas>
  <div id="overlay"></div>
</div>

<script src="../js/shadow-plugin.js"></script>
<script src="../js/shadow-layout-defaults.js"></script>
<script src="../js/shadow-scene-scale.js"></script>
<script src="../js/shadow-layout-receiver.js"></script>

<script src="../js/logo-row-defaults.js"></script>
<script src="../js/host-scene-scale.js"></script>
<script src="../js/layout-common.js?v=20260730c"></script>
<script src="../js/bg-block-defaults.js"></script>
<script src="../js/bg-block-render.js"></script>
<script src="../js/color-theme-engine.js"></script>
<script>
'use strict';

var W = 1125, H = 360;

/* ── PSD 規格 ── */
var ZONE = { x:608, y:25,  w:517, h:341 }; // 作圖區（clip 用，不顯示）——右邊界延伸到畫布右邊(1125)
var LOGO = { x:52,  y: 42.5,  w:386, h:61.5  };
var BAR  = { x:666, y:309, w:464, h:51  };
var GAP  = 15; // logo 分隔線兩側間距
var LOGO_RATIOS = getLogoRowRatios(); // logo1 高度 / 分隔線長度比例，來自 logo-row-defaults.js

var cv      = document.getElementById('cv');
/* 2026-07-28 跟 Iona 確認移除：這個版位不再直接接收陰影套件的原始素材廣播
   （LC_UPSERT_SLOT 等）自己畫一次商品/主持人——現在商品/主持人/陰影/舞台都在
   1200 商品編輯畫布合成好、攤平成一張圖，透過「主持人」圖層（D.host）帶進來，
   兩邊同時畫會變成同一個商品疊兩次。原本的 lcReceiver 已拿掉，D.host 的繪製
   邏輯維持不變。 */
var overlay = document.getElementById('overlay');
var stage   = document.getElementById('stage');

/* ── 高 DPR（Retina 畫質） ── */
var DPR = 1;
var ctx = cv.getContext('2d');
cv.width  = W;
cv.height = H;
cv.style.width  = W + 'px';
cv.style.height = H + 'px';

/* ── State ── */
var D = {
  theme:'A', bgColor:'#0D3165', /* 底色吸取（毛孩衝蝦米）：不再用 bg 圖片，改吃 seedHex 純色 */
  host:null, hostBounds:null, logo1:null, logo2:null, logo2Shape:null, ctaBtn:null,
  main:'主標文案$9字內', sub:'副標文案$8字內',
  date:'XX/XX', time:'19:00', brand:'XXX', guest:'', combo:null,
  // 主標/副標/日期顏色唯一資料來源是 editor-state.js 的 BG_TEXT_DEF，這裡不重複寫死初始值，
  // 一律等 editor 廣播進來；欄位命名跟顯示標籤是反的：cSub=主標/cMain=副標/cDate=日期
  showCTA: true,  // 預設顯示 CTA
  imgX: ZONE.x + ZONE.w/2,
  imgY: ZONE.y + ZONE.h/2,
  imgW: 0, imgH: 0,
  imgScale: 1,
  selected: false,
  dragging: false, dragStartX:0, dragStartY:0, imgStartX:0, imgStartY:0,
  resizing: false,
  _lastHostSrc: null,
};

function render(){
  ctx.clearRect(0,0,W,H);

  // 背景：底色吸取（毛孩衝蝦米）——斜切色塊＋刷不透明度，顏色跟著 D.bgColor（seedHex）自動算
  BgBlockRender.draw(ctx, W, H, D.bgColor, '02_lpbn');

  // 作圖區：clip 讓圖不超出（但選取框在 overlay 上，不受影響）
  ctx.save();
  ctx.beginPath();
  ctx.rect(ZONE.x,ZONE.y,ZONE.w,ZONE.h);
  ctx.clip();
  if(D.host){
    var dw=D.host.naturalWidth*D.imgScale;
    var dh=D.host.naturalHeight*D.imgScale;
    D.imgW=dw; D.imgH=dh;
    ctx.drawImage(D.host, D.imgX-dw/2, D.imgY-dh/2, dw, dh);
  }
  ctx.restore();


  drawLogos();
  drawText();
  drawHostBar();
  if(D.showCTA) drawCTA();

  updateOverlay();
}

function drawLogos(){
  var a = LOGO;
  var hasLogo2 = !!(D.logo2 && D.logo2.naturalWidth);

  var lh1=0, lw1=0;
  if(D.logo1 && D.logo1.naturalWidth){
    lh1 = a.h * LOGO_RATIOS.logo1HeightRatio;
    lw1 = D.logo1.naturalWidth * (lh1 / D.logo1.naturalHeight);
  }

  // 沒有 logo2（也就沒有分隔線）時，logo1 要在 LOGO 區內單獨置中；
  // 有 logo2 時維持原本靠左排版，讓分隔線／logo2 接在後面
  var x = hasLogo2 ? a.x : a.x + (a.w - lw1)/2;

  if(D.logo1 && D.logo1.naturalWidth){
    ctx.drawImage(D.logo1, x, a.y, lw1, lh1);
    x += lw1;
  }

  if(!hasLogo2) return;

  // 分隔線前後間距
  x += LOGO_RATIOS.gapBeforeDividerPx;
  var lineH = a.h * LOGO_RATIOS.dividerHeightRatio;
  ctx.strokeStyle = '#b36e57'; ctx.lineWidth = LOGO_RATIOS.dividerLineWidthPx;
  ctx.beginPath();
  ctx.moveTo(x, a.y + (a.h - lineH)/2);
  ctx.lineTo(x, a.y + (a.h + lineH)/2);
  ctx.stroke();
  x += LOGO_RATIOS.gapAfterDividerPx;

  /* logo2：editor 的 Logo2 編輯面板已經把圓角/底色/位置合成好了，
     這裡拿到的是現成的一張圖，跟 logo1 一樣直接畫，固定高度、寬度依比例算 */
  var lh2 = a.h * logo2HeightRatioFor(D.logo2Shape, LOGO_RATIOS);
  var lw2 = D.logo2.naturalWidth * (lh2 / D.logo2.naturalHeight);
  ctx.drawImage(D.logo2, x, a.y + (a.h - lh2)/2, lw2, lh2); // 高度比 logo1 矮，垂直置中對齊
}

function drawText(){
  ctx.textAlign = 'left';

  /* ── 主標：PSD top=116.21, left=47.35, 41px Medium ── */
  ctx.font = font(41, 500);
  var mainAscent   = ctx.measureText('測').actualBoundingBoxAscent || 41 * 0.88;
  var mainBaseline = 115.21 + mainAscent;
  if(D.main){
    ctx.fillStyle = D.cSub;
    ctx.fillText(D.main, 47, mainBaseline);
  }

  /* ── 日期時間：PSD top=130.31, left=377.48, 26px Regular ── */
  // 日期：緊接主標右側 + 24px，高度維持
  ctx.font = font(41, 500); // 先用主標字型量主標寬度
  var mainW = D.main ? ctx.measureText(D.main).width : 0;
  ctx.font = font(26, 400);
  var dateAscent   = ctx.measureText('測').actualBoundingBoxAscent || 26 * 0.88;
  var dateBaseline = 129.31 + dateAscent;
  var dateX        = 47 + mainW + 24;
  ctx.fillStyle = D.cDate;
  ctx.fillText(D.date + ' ' + D.time, dateX, dateBaseline);

  /* ── 副標：PSD top=166.01, left=43.94, 70px Bold ── */
  ctx.font = font(70, 700);
  var subAscent   = ctx.measureText('測').actualBoundingBoxAscent || 70 * 0.88;
  var subBaseline = 169.01 + subAscent;
  if(D.sub){
    ctx.fillStyle = D.cMain;
    ctx.fillText(D.sub, 44, subBaseline);
  }
}

function drawHostBar(){
  var b=BAR;
  /* 2026-07-28 跟 Iona 確認新增：Bar 底色改成跟著底色（種子色）自動推算，
     不再寫死粉紅色——用 color-theme-engine.js 的 pickBarColor()，是一組獨立
     配色邏輯（不是分隔線 sepColor），只保證跟固定的白色文字維持對比。
     ColorThemeEngine 沒載入或還沒收到 bgColor 時，退回原本寫死的粉紅色，
     維持舊行為，不會整條 bar 沒有顏色。 */
  var barColor = '#dd447d';
  if (window.ColorThemeEngine && D.bgColor) {
    var picked = window.ColorThemeEngine.pickBarColor(D.bgColor);
    if (picked) barColor = picked;
  }
  var barColorRgb = BgBlockRender.hexToRgba(barColor, 1); // 沿用同一份 hexToRgba，不重寫 hex 轉換
  // 漸層
  var grad=ctx.createLinearGradient(b.x,0,b.x+65,0);
  grad.addColorStop(0, BgBlockRender.hexToRgba(barColor, 0));
  grad.addColorStop(1, barColorRgb);
  ctx.fillStyle=grad; ctx.fillRect(b.x,b.y,65,b.h);
  ctx.fillStyle=barColor; ctx.fillRect(b.x+65,b.y,b.w-65,b.h);

  // 文字規格：29.41pt ≈ 39px，白色
  // 格式：主持人 [15px空] | [15px空] 人名，整體置右
  // 有來賓時：來賓 | 來賓名稱 [兩個空格寬] 主持人 | 主持人名稱
  var fs = 29; // 29.41pt * (96/72) ≈ 39px
  ctx.font = font(fs, 500);
  ctx.fillStyle = '#ffffff';

  var wLine  = 1;   // 分隔線寬度視覺上 1px
  var GAP15  = 8;
  var GAPGRP = ctx.measureText('  ').width; // 群組之間的間距＝兩個全形空白寬

  // 每個群組（來賓 | 名字、主持人 | 名字）各自的寬度
  function measureGroup(label, name){
    return ctx.measureText(label).width + GAP15 + wLine + GAP15 + ctx.measureText(name).width;
  }

  var groups = [];
  groups.push({ label:'主持人', name: D.brand || 'XXX' });
  if(D.guest){ groups.push({ label:'來賓', name: D.guest }); }

  var totalW = 0;
  groups.forEach(function(g, i){
    totalW += measureGroup(g.label, g.name);
    if(i < groups.length-1) totalW += GAPGRP;
  });

  // 置右：從 bar 右側 20px 開始往左
  var rightEdge = b.x + b.w - 20;
  var startX    = rightEdge - totalW;

  // 垂直置中
  var baseline  = b.y + b.h/2 + fs * 0.35;

  ctx.textAlign = 'left';
  var cx = startX;
  groups.forEach(function(g, i){
    var wLabel = ctx.measureText(g.label).width;
    var wName  = ctx.measureText(g.name).width;
    ctx.fillText(g.label, cx, baseline);
    cx += wLabel + GAP15;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, b.y + 10);
    ctx.lineTo(cx, b.y + b.h - 10);
    ctx.stroke();
    cx += wLine + GAP15;
    ctx.fillText(g.name, cx, baseline);
    cx += wName;
    if(i < groups.length-1) cx += GAPGRP;
  });
  ctx.textAlign = 'left';
}

function drawCTA(){
  // CTA 規格：x=54, y=253, w=217, h=67
  var bx=54, by=253, bw=217, bh=67;
  if(D.ctaBtn && D.ctaBtn.naturalWidth){
    ctx.drawImage(D.ctaBtn, bx, by, bw, bh);
  } else {
    // fallback：手動繪製
    var r=bh/2;
    ctx.beginPath();
    ctx.moveTo(bx+r,by); ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,r); ctx.arcTo(bx,by+bh,bx,by,r);
    ctx.arcTo(bx,by,bx+bw,by,r); ctx.closePath();
    ctx.fillStyle='#EE4D2D'; ctx.fill();
    ctx.font=font(22,700); ctx.fillStyle='white'; ctx.textAlign='center';
    ctx.fillText('⊙ 立即看', bx+bw/2, by+bh/2+8);
    ctx.textAlign='left';
  }
}

/* ── Overlay：選取框 + handles + 懸浮 bar ── */
function initHostPos(){
  D.hostBounds = calcTightBounds(D.host);
  if(D.hostBounds){
    /* 有色部分填滿作圖區，再放大 20% */
    var scH = ZONE.h / D.hostBounds.h;
    var scW = ZONE.w / D.hostBounds.w;
    D.imgScale = Math.min(scH, scW) * 1.2;
    D.imgScale *= getHostSceneScale(D.combo); // 這個版位「主持人圖層」預設縮放（host-scene-scale.js），不影響使用者後續手動調整
    var dw = D.host.naturalWidth  * D.imgScale;
    var dh = D.host.naturalHeight * D.imgScale;
    /* 水平：有色中心對齊作圖區水平中心 */
    var bcX = D.hostBounds.x * D.imgScale + D.hostBounds.w * D.imgScale / 2;
    D.imgX = ZONE.x + ZONE.w/2 - bcX + dw/2;
    /* 垂直：有色頂部對齊作圖區頂部（頭部不被遮擋） */
    var boundsTop = D.hostBounds.y * D.imgScale;
    D.imgY = ZONE.y - boundsTop + dh/2;
    D.imgY += getHostSceneOffsetY(D.combo); // 這個版位「主持人圖層」預設Y偏移（host-scene-scale.js），不影響使用者後續手動調整
  } else {
    /* 無 bounds 退回 cover */
    D.imgX = ZONE.x + ZONE.w/2;
    D.imgY = ZONE.y + ZONE.h/2;
    D.imgY += getHostSceneOffsetY(D.combo); // 這個版位「主持人圖層」預設Y偏移（host-scene-scale.js），不影響使用者後續手動調整
    D.imgScale = Math.max(ZONE.w/D.host.naturalWidth, ZONE.h/D.host.naturalHeight);
    D.imgScale *= getHostSceneScale(D.combo); // 這個版位「主持人圖層」預設縮放（host-scene-scale.js），不影響使用者後續手動調整
  }
}

/* ── postMessage ── */
window.addEventListener('message',function(e){
  var msg=e.data;

  /* 狀態儲存/恢復 */
  if(msg && msg.type==='BN_GET_STATE'){
    window.parent.postMessage({
      type:'BN_CANVAS_STATE',
      msgId: msg.msgId,
      state:{ imgX:D.imgX, imgY:D.imgY, imgScale:D.imgScale, selected:false }
    },'*');
    return;
  }
  if(msg && msg.type==='BN_RESTORE_STATE'){
    var st = msg.state || {};
    if(st.imgX!==undefined) D.imgX = st.imgX;
    if(st.imgY!==undefined) D.imgY = st.imgY;
    if(st.imgScale!==undefined) D.imgScale = st.imgScale;
    render();
    return;
  }

  if(!msg||msg.type!=='BN_UPDATE') return;
  var p=msg.payload;

  if(p.theme!==undefined) D.theme=p.theme;
  if(p.main!==undefined)  D.main=p.main;
  if(p.sub!==undefined)   D.sub=p.sub;
  if(p.date!==undefined)  D.date=p.date;
  if(p.time!==undefined)  D.time=p.time;
  if(p.brand!==undefined) D.brand=p.brand;
  if(p.combo!==undefined) D.combo=p.combo;
  if(p.guest!==undefined) D.guest=p.guest;
  if(p.cSub!==undefined)  D.cSub=p.cSub;
  if(p.cMain!==undefined) D.cMain=p.cMain;
  if(p.cDate!==undefined) D.cDate=p.cDate;
  if(p.showCTA!==undefined) D.showCTA=p.showCTA;
  /* 底色吸取（毛孩衝蝦米）：bgColor 是 editor 的 S.seedHex，不再載入 bg 圖片 */
  if(p.bgColor!==undefined){
    D.bgColor = p.bgColor || '#0D3165';
    /* 2026-07-28 跟 Iona 確認新增：logo1 原本只在頁面載入時抓一次固定的橘色版，
       完全沒有跟著底色換版——這裡改成每次底色更新都檢查一次深淺，版本真的變了
       （橘↔白）才重新載圖，版本沒變就不動，避免每次都閃一下重載。 */
    updateLogo1ForBgColor();
  }

  var pending=0;
  function dec(){ if(--pending<=0) render(); }

  if(p.host!==undefined){ pending++;
    var isNew=!D.host||(p.host!==D._lastHostSrc&&!p.keepPos);
    loadImg(p.host,function(img){
      D.host=img;
      if(img&&isNew){
        D._lastHostSrc=p.host;
        initHostPos(); D.selected=false; // initHostPos 內已呼叫 calcTightBounds
      }
      else if(img){ D._lastHostSrc=p.host; }
      dec();
    });
  }
  /* logo1 目前仍維持預設內建、忽略外部傳入；
     毛孩衝蝦米這個專案的LPBN不需要logo2（合作方logo只出現在FL Icon／Tab），
     所以這裡故意不吃 p.logo2／p.logo2Shape，D.logo2 永遠是 null，
     drawLogos() 會自動判斷 hasLogo2=false，logo1 單獨置中，不畫分隔線 */
  if(pending===0) render();
});

/* ── Export ── */
function exportBlob(fmt, q, cb){
  var out = document.createElement('canvas');
  out.width  = W;
  out.height = H;
  out.getContext('2d').drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, W, H);
  out.toBlob(cb, 'image/'+(fmt||'jpeg'), q||0.95);
}

function snapBlob(fmt, q, cb){
  var ws = D.selected; D.selected = false; render();
  exportBlob(fmt, q, function(blob){ D.selected=ws; render(); cb(blob); });
}

window.BNExport = {
  /* 單張輸出（目前狀態） */
  getBlob: function(fmt, q, cb){ snapBlob(fmt, q, cb); },

  /* 輸出兩張：有CTA + 無CTA */
  getBothBlobs: function(fmt, q, cb){
    var origCTA = D.showCTA;
    /* 第一張：有CTA */
    D.showCTA = true; render();
    exportBlob(fmt, q, function(blobWith){
      D.showCTA = false; render();
      exportBlob(fmt, q, function(blobWithout){
        D.showCTA = origCTA; render();
        cb(blobWith, blobWithout);
      });
    });
  },

  spec:{id:'02_lpbn', name:'直播大廳 LPBN', width:W, height:H, hasCTAVariant:true}
};

/* ── Init ── */
/* 2026-07-28 跟 Iona 確認新增：logo1 深淺（logo_shopee_live.png／logo_shopee_live_white.png）
   跟著 D.bgColor 走 ColorThemeEngine.pickLogoAssets()，不再寫死橘色版。
   _logo1IsWhite 記錄目前載入的是哪一版，bgColor 更新時只有版本真的變了才重載圖片。 */
var _logo1IsWhite = null;
function updateLogo1ForBgColor(cb){
  var pick = (window.ColorThemeEngine && D.bgColor)
    ? window.ColorThemeEngine.pickLogoAssets(D.bgColor)
    : { logo1: 'logos/logo_shopee_live.png', isWhite: false };
  if (pick.isWhite === _logo1IsWhite && D.logo1) { if (cb) cb(); return; }
  _logo1IsWhite = pick.isWhite;
  var img = new Image();
  img.onload = function(){ D.logo1 = img; if (cb) cb(); else render(); };
  img.onerror = function(){ if (cb) cb(); };
  img.src = '../' + pick.logo1;
}

function loadDefaultLogos(cb){
  var done=0;
  function tick(){ if(++done>=3) cb(); }
  updateLogo1ForBgColor(tick);
  /* 毛孩衝蝦米：LPBN不放logo2，故意不載入logo_star_studio.png，直接算完成 */
  tick();
  var i3=new Image();
  i3.onload=function(){ D.ctaBtn=i3; tick(); };
  i3.onerror=tick;
  i3.src='../logos/cta_btn.png';
}

/* 明確等待三個字重都載入 */
Promise.all([
  document.fonts.load('700 16px ShopeeNoto'),
  document.fonts.load('500 16px ShopeeNoto'),
  document.fonts.load('400 16px ShopeeNoto'),
]).catch(function(){}).then(function(){
  loadDefaultLogos(function(){
    render();
    if(window.parent!==window){
      window.parent.postMessage({type:'BN_READY',id:'02_lpbn'},'*');
      window.parent.postMessage({type:'LC_READY'},'*');
    }
  });
});
</script>
</body>
</html>
