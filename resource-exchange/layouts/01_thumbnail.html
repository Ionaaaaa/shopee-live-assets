<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>01 直播時縮圖</title>
<style>
@font-face { font-family:'ShopeeNoto'; font-weight:700; src:url('../fonts/ShopeeNotoSans(content)-Bold.ttf') format('truetype'); }
@font-face { font-family:'ShopeeNoto'; font-weight:500; src:url('../fonts/ShopeeNotoSans(content)-Medium.ttf') format('truetype'); }
@font-face { font-family:'ShopeeNoto'; font-weight:400; src:url('../fonts/ShopeeNotoSans(content)-Regular.ttf') format('truetype'); }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { background:transparent; overflow:hidden; }

#stage {
  position: relative;
  width: 720px;
  height: 720px;
}
canvas {
  position: absolute;
  top: 0; left: 0;
  display: block;
}

/* overlay — 完全蓋住 canvas，不 clip */
#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 720px;
  height: 720px;
  pointer-events: none;
  overflow: visible; /* 讓超出的控制項可見 */
}

/* 選取框 */
.sel-box {
  position: absolute;
  border: 2px solid #2563EB;
  box-shadow: 0 0 0 1px rgba(37,99,235,0.25);
  pointer-events: none;
}

/* 變形 handle */
.sel-handle {
  position: absolute;
  width: 10px; height: 10px;
  background: white;
  border: 2px solid #2563EB;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  z-index: 10;
}
.sel-handle[data-h="n"],  .sel-handle[data-h="s"]  { cursor: ns-resize; }
.sel-handle[data-h="e"],  .sel-handle[data-h="w"]  { cursor: ew-resize; }
.sel-handle[data-h="nw"], .sel-handle[data-h="se"] { cursor: nwse-resize; }
.sel-handle[data-h="ne"], .sel-handle[data-h="sw"] { cursor: nesw-resize; }

/* 懸浮 action bar */
.sel-bar {
  position: absolute;
  display: flex;
  gap: 2px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 4px;
  pointer-events: auto;
  transform: translateY(-100%) translateY(-8px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  z-index: 20;
}
.sel-bar-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: background 0.12s, color 0.12s;
}
.sel-bar-btn:hover { background: #334155; color: white; }
.sel-bar-btn.danger:hover { background: rgba(239,68,68,0.2); color: #f87171; }
.sel-bar-btn svg {
  width: 13px; height: 13px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}
.sel-bar-sep {
  width: 1px;
  background: #334155;
  margin: 2px 0;
  flex-shrink: 0;
}
</style>

</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="720"></canvas>
  <div id="overlay"></div>
  <div id="logo2-ui" style="position:absolute;top:0;left:0;width:720px;height:720px;pointer-events:none;overflow:visible;z-index:50;"></div>
  <img id="ui-layer" src="../logos/ui_popup.png"
    style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:998;"
    onerror="this.style.display='none'">
  <div id="ui-toggle" onclick="toggleUILayer()"
    title="顯示/隱藏參考層"
    style="position:absolute;top:8px;right:8px;z-index:999;cursor:pointer;
           background:rgba(0,0,0,0.45);border-radius:6px;padding:5px 7px;
           color:white;font-size:14px;line-height:1;user-select:none;">👁</div>
</div>

<script>
'use strict';

var W = 720, H = 720;

/* ── PSD 規格 ── */
var ZONE = { x:135, y:301, w:452, h:419 }; // 作圖區（y 下移 15px）
var LOGO = { x:210, y:107, w:300, h:44  }; // CSS: left:210 top:107 width:300 height:44 // LOGO 區（PSD：主標上方，水平置中）
var BAR  = { x:0,   y:0,   w:0,   h:0   }; // 無主持人bar
var GAP  = 10; // 分隔線兩側間距

var cv      = document.getElementById('cv');
var overlay = document.getElementById('overlay');
var stage   = document.getElementById('stage');

/* ── 高 DPR（Retina 畫質） ── */
var DPR = window.devicePixelRatio || 1;
var ctx = cv.getContext('2d');
if(DPR > 1){
  cv.width  = W * DPR;
  cv.height = H * DPR;
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.scale(DPR, DPR);
}

/* ── State ── */
var D = {
  theme:'A', bg:null, bgUrl:null,
  host:null, hostBounds:null, logo1:null, logo2:null, ctaBtn:null,
  _logo2DataUrl: null,  // logo2 的 base64 src（postMessage 用）
  main:'主標文案$9字內', sub:'副標文案$8字內',
  date:'XX/XX', time:'19:00', brand:'XXX',
  cSub:'#fff2d0',     /* 主標顏色（由 editor 傳入）*/
  cMain:'#fffd72',    /* 副標顏色（由 editor 傳入）*/
  cDate:'#fff2d0',     /* 日期時間顏色（由 editor 傳入）*/
  sepColor:'#ffffff', /* LOGO 分隔線（由 editor 傳入）*/
  showCTA: false,  // IG 無 CTA
  imgX: ZONE.x + ZONE.w/2,
  imgY: ZONE.y + ZONE.h/2,
  imgW: 0, imgH: 0,
  imgScale: 1,
  selected: false,
  dragging: false, dragStartX:0, dragStartY:0, imgStartX:0, imgStartY:0,
  resizing: false,
  _lastHostSrc: null,
};

/* ╔══════════════════════════════════════════════════════════════
   ║  ████  色票設定區  ████
   ║  可在此修改所有顏色，下方各版位皆引用這裡的變數
   ║
   ║  【背景款式 BG_FALLBACK】
   ║    A = 黃色款  B = 粉色款  C = 藍色款
   ║    新增款式：在 BG_FALLBACK 加一組 key:'#色碼'
   ║             並在 BG_THEMES (editor.html) 加對應項目
   ║
   ║  【文字顏色 — 由 editor 傳入 cSub / cMain / cDate】
   ║    預設值在 State D 裡（下方）：
   ║      cSub  = 主標（小字）顏色，預設 #AD6B00（深金）
   ║      cMain = 副標（大字）顏色，預設 #EE4D2D（蝦皮橘紅）
   ║      cDate = 日期時間顏色，預設 #AD6B00（深金）
   ║
   ║  【LOGO 區黑底背景透明度】
   ║    drawLogos() 裡 rgba(0,0,0, 0.761) → 改數字調整透明度
   ║    目前：無底色（直接繪製在背景上）
   ║
   ║  【分隔線顏色】
   ║    drawLogos() 裡 rgba(255,255,255, 0.6) → 白色半透明
   ╚══════════════════════════════════════════════════════════════ */
/* ── 背景款式對應色（無背景圖時的 fallback 底色）──
   新增公版：加一組 key 和色碼即可，例如 D:'#c8f0d8' */
var BG_FALLBACK = {
  A: '#F5C842',   /* 款式 A — 黃色 */
  B: '#F5A0C5',   /* 款式 B — 粉色 */
  C: '#bee1f2',   /* 款式 C — 淺藍 */
  /* ↓ 新增公版在這裡 ↓ */
};

/* ═══════════════════════════════════════════════════
   Logo2 互動狀態
   _logo2Scale : 縮放倍率（1 = 預設 contain 大小）
   _logo2Sel   : 是否選取中
   _logo2Box   : 當前框位置 { x,y,w,h }（畫布座標）
   _logo2Bounds: tight bounds（有色範圍，避免白邊）
   ═══════════════════════════════════════════════════ */
var _logo2Scale  = 1;
var _logo2RD     = null; // resize drag data
var _logo2Sel    = false;
var _logo2Box    = null;
var _logo2Bounds = null;
/* logo2 在框內的偏移（拖動用）*/
var _logo2OffX   = 0;
var _logo2OffY   = 0;
var _logo2DragData = null; // { sx, sy, ox, oy }

function calcLogo2Bounds(img){
  try{
    var SCAN=300, sc=Math.min(1,SCAN/Math.max(img.naturalWidth,img.naturalHeight));
    var sw=Math.max(1,Math.floor(img.naturalWidth*sc));
    var sh=Math.max(1,Math.floor(img.naturalHeight*sc));
    var tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    var tx=tmp.getContext('2d'); tx.clearRect(0,0,sw,sh); tx.drawImage(img,0,0,sw,sh);
    var d=tx.getImageData(0,0,sw,sh).data;
    var x0=sw,y0=sh,x1=0,y1=0,found=false;
    for(var y=0;y<sh;y++) for(var x=0;x<sw;x++){
      if(d[(y*sw+x)*4+3]>15){
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; found=true;
      }
    }
    if(!found) return null;
    return {x:x0/sc, y:y0/sc, w:(x1-x0+1)/sc, h:(y1-y0+1)/sc};
  }catch(e){ return null; }
}

function font(size, w){ return w+' '+size+'px "ShopeeNoto","Noto Sans TC",sans-serif'; }

/* ── BG ── */
/* _renderNotify 通知：只送一次，背景和圖片都載完後才送 */
function _notifyRendered(){
  if(window._renderNotify){
    window.parent.postMessage({type:'BN_RENDERED',id:'01_thumbnail'},'*');
  }
}
function loadBg(url){
  if(!url){ D.bg=null; D.bgUrl=null; render(); return; }
  if(url===D.bgUrl && D.bg){ render(); return; }
  D.bgUrl=url;
  var img=new Image();
  img.onload=function(){ D.bg=img; render(); };
  img.onerror=function(){ D.bg=null; render(); };
  img.src=url;
}
function loadImg(src, cb){
  if(!src){ cb(null); return; }
  var img=new Image();
  img.onload=function(){ cb(img); };
  img.onerror=function(){ cb(null); };
  img.src=src;
}

/* ── Render ── */
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // 背景（先填白色防止透明 PNG 合成時殘留前一張顏色）
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);
  if(D.bg){ ctx.drawImage(D.bg,0,0,W,H); }
  else { ctx.fillStyle=BG_FALLBACK[D.theme]||'#F5C842'; ctx.fillRect(0,0,W,H); }

  // 作圖區：clip 讓圖不超出（但選取框在 overlay 上，不受影響）
  ctx.save();
  ctx.beginPath();
  ctx.rect(ZONE.x,ZONE.y,ZONE.w,ZONE.h);
  ctx.clip();
  if(D.host){
    var dw=D.host.naturalWidth*D.imgScale;
    var dh=D.host.naturalHeight*D.imgScale;
    D.imgW=dw; D.imgH=dh;
    ctx.drawImage(D.host, D.imgX-dw/2, D.imgY-dh/2, dw, dh);
  }
  ctx.restore();

  drawLogos();
  drawText();
  /* 開播字卡無主持人 bar */
  if(D.showCTA) drawCTA();

  updateOverlay();
  updateLogo2UI();
  /* 下載模式：render 完成後通知 parent */
}

/* 採樣 logo2 四角像素取平均底色；透明底 fallback 白色 */
function sampleLogo2BgColor(img){
  var os = document.createElement('canvas');
  os.width = img.naturalWidth; os.height = img.naturalHeight;
  var oc = os.getContext('2d');
  oc.drawImage(img, 0, 0);
  var pts=[[0,0],[img.naturalWidth-1,0],[0,img.naturalHeight-1],[img.naturalWidth-1,img.naturalHeight-1]];
  var r=0,g=0,b=0,a=0,cnt=0;
  pts.forEach(function(p){
    try{ var d=oc.getImageData(p[0],p[1],1,1).data;r+=d[0];g+=d[1];b+=d[2];a+=d[3];cnt++;}catch(_){}
  });
  if(!cnt||a/cnt<128) return '#ffffff';
  return 'rgb('+Math.round(r/cnt)+','+Math.round(g/cnt)+','+Math.round(b/cnt)+')';
}
function drawRoundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

function drawLogos(){
  /* ═══════════════════════════════════════════════════════
     LOGO 區規格：
       位置  x:150  y:100  w:421  h:63
       logo1 蝦皮直播（左，高度 72%，等比）
       分隔  15px + 1px 白線 + 15px
       logo2 贊助商（固定框 113×63，3px 圓角，採樣底色）
       整體水平置中（以固定 L2_W 計算，不受縮放影響）
     ═══════════════════════════════════════════════════════ */
  var a = LOGO;
  var L2_W = 113;   // logo2 框寬（固定，置中計算用）
  var L2_H = 44;    // logo2 框高（= LOGO 區高度）
  var L2_R = 3;     // logo2 圓角
  _logo2Box = null;

  /* logo1 尺寸 */
  var l1w = 0, l1h = 0;
  if(D.logo1 && D.logo1.naturalWidth){
    l1h = a.h * 0.72;
    l1w = D.logo1.naturalWidth * (l1h / D.logo1.naturalHeight);
  }

  /* logo2 有色範圍（tight bounds）→ contain 縮放 → 套 _logo2Scale */
  var hasL2 = D.logo2 && D.logo2.naturalWidth;
  var l2sx=0, l2sy=0, l2sw=0, l2sh=0, l2w=0, l2h=0;
  if(hasL2){
    var b2 = _logo2Bounds;
    l2sx = b2?b2.x:0; l2sy = b2?b2.y:0;
    l2sw = b2?b2.w:D.logo2.naturalWidth; l2sh = b2?b2.h:D.logo2.naturalHeight;
    var sclBase = Math.min(L2_W/l2sw, L2_H/l2sh);
    var scl = sclBase * _logo2Scale;
    l2w = l2sw*scl; l2h = l2sh*scl;
  }

  /* 置中：固定用 L2_W（不隨縮放跑位）*/
  var sep   = hasL2 ? (15 + 1 + 15) : 0;
  var totalW = l1w + sep + (hasL2 ? L2_W : 0);
  var startX = a.x + (a.w - totalW) / 2;
  var curX   = startX;

  /* logo1 */
  if(D.logo1 && D.logo1.naturalWidth){
    ctx.drawImage(D.logo1, curX, a.y + (a.h - l1h)/2, l1w, l1h);
    curX += l1w;
  }

  /* 分隔線 + logo2 */
  if(hasL2){
    curX += 15;
    ctx.save();
    ctx.strokeStyle = D.sepColor||'#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(curX, a.y+6); ctx.lineTo(curX, a.y+a.h-6); ctx.stroke();
    ctx.restore();
    curX += 1 + 15;

    /* logo2 框（固定 L2_W × L2_H，置中）*/
    var frameX = curX;
    var frameY = a.y + (a.h - L2_H) / 2;
    /* 採樣底色 */
    var bgColor = '#ffffff';
    try{ bgColor = sampleLogo2BgColor(D.logo2); }catch(e){}
    ctx.save(); drawRoundRect(ctx, frameX, frameY, L2_W, L2_H, L2_R);
    ctx.fillStyle = bgColor; ctx.fill(); ctx.restore();
    /* 繪製 logo2（置中於框內，clip 圓角）*/
    /* _logo2OffX/_logo2OffY：拖動偏移（相對於框中心）*/
    var imgX = frameX + (L2_W - l2w)/2 + _logo2OffX;
    var imgY = frameY + (L2_H - l2h)/2 + _logo2OffY;
    ctx.save(); drawRoundRect(ctx, frameX, frameY, L2_W, L2_H, L2_R); ctx.clip();
    ctx.drawImage(D.logo2, l2sx, l2sy, l2sw, l2sh, imgX, imgY, l2w, l2h);
    ctx.restore();
    /* 記錄框位置供 UI overlay 使用 */
    _logo2Box = { x:frameX, y:frameY, w:L2_W, h:L2_H };
  }
}
function drawText(){
  var CX = W / 2;

  /* ── 副標：63px Bold，置中，top=169（主標已移除）── */
  ctx.font = font(63, 700);
  var subAscent = ctx.measureText('測').actualBoundingBoxAscent || 63 * 0.88;
  if(D.sub){
    ctx.fillStyle = D.cMain;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '-2px';
    ctx.fillText(D.sub, CX, 169 + subAscent);
    ctx.letterSpacing = '0px';
  }

  /* ── 日期時間：34px Regular，置中，top=241 ── */
  ctx.font = font(34, 400);
  var dateAscent = ctx.measureText('測').actualBoundingBoxAscent || 34 * 0.88;
  ctx.fillStyle = D.cDate;
  ctx.textAlign = 'center';
  ctx.fillText(D.date + ' ' + D.time, CX, 241 + dateAscent);

  ctx.textAlign = 'left';
}

function drawHostBar(){ /* 開播字卡無主持人 bar */ }

function drawCTA(){
  // CTA 規格：x=54, y=253, w=217, h=67
  var bx=54, by=253, bw=217, bh=67;
  if(D.ctaBtn && D.ctaBtn.naturalWidth){
    ctx.drawImage(D.ctaBtn, bx, by, bw, bh);
  } else {
    // fallback：手動繪製
    var r=bh/2;
    ctx.beginPath();
    ctx.moveTo(bx+r,by); ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,r); ctx.arcTo(bx,by+bh,bx,by,r);
    ctx.arcTo(bx,by,bx+bw,by,r); ctx.closePath();
    ctx.fillStyle='#EE4D2D'; ctx.fill();
    ctx.font=font(22,700); ctx.fillStyle='white'; ctx.textAlign='center';
    ctx.fillText('⊙ 立即看', bx+bw/2, by+bh/2+8);
    ctx.textAlign='left';
  }
}

/* ── Overlay：選取框 + handles + 懸浮 bar ── */
function updateOverlay(){
  overlay.innerHTML='';
  if(!D.host||!D.selected) return;

  var dw = D.host.naturalWidth  * D.imgScale;
  var dh = D.host.naturalHeight * D.imgScale;
  D.imgW = dw; D.imgH = dh;

  /* 用 tight bounds 決定選取框範圍 */
  var boxL, boxT, boxW, boxH;
  if(D.hostBounds){
    var PAD = 2;
    boxL = D.imgX - dw/2 + D.hostBounds.x * D.imgScale - PAD;
    boxT = D.imgY - dh/2 + D.hostBounds.y * D.imgScale - PAD;
    boxW = D.hostBounds.w * D.imgScale + PAD*2;
    boxH = D.hostBounds.h * D.imgScale + PAD*2;
  } else {
    boxL = D.imgX - dw/2;
    boxT = D.imgY - dh/2;
    boxW = dw; boxH = dh;
  }
  var imgL=boxL, imgT=boxT, imgR=boxL+boxW, imgB=boxT+boxH;

  var box=document.createElement('div');
  box.className='sel-box';
  box.style.cssText='left:'+imgL+'px;top:'+imgT+'px;width:'+boxW+'px;height:'+boxH+'px;';
  overlay.appendChild(box);

  [
    {h:'nw',lx:imgL,        ly:imgT        },
    {h:'n', lx:imgL+boxW/2, ly:imgT        },
    {h:'ne',lx:imgR,        ly:imgT        },
    {h:'e', lx:imgR,        ly:imgT+boxH/2 },
    {h:'se',lx:imgR,        ly:imgB        },
    {h:'s', lx:imgL+boxW/2, ly:imgB        },
    {h:'sw',lx:imgL,        ly:imgB        },
    {h:'w', lx:imgL,        ly:imgT+boxH/2 },
  ].forEach(function(hd){
    var el=document.createElement('div');
    el.className='sel-handle';
    el.dataset.h=hd.h;
    el.style.cssText='left:'+hd.lx+'px;top:'+hd.ly+'px;';
    el.addEventListener('mousedown',startResize);
    overlay.appendChild(el);
  });

  // 懸浮 action bar — 置於圖片頂部中央，超出畫布上方時改顯示在下方
  var bar=document.createElement('div');
  bar.className='sel-bar';
  bar.innerHTML=
    '<button class="sel-bar-btn" onclick="doAction(\'edit\')">'
    +'<svg viewBox="0 0 16 16"><path d="M2 14l2-5L12 1l3 3-8 8-5 2z"/><path d="M10 3l3 3"/></svg>去背編輯</button>'
    +'<div class="sel-bar-sep"></div>'
    +'<button class="sel-bar-btn" onclick="doAction(\'replace\')">'
    +'<svg viewBox="0 0 16 16"><path d="M1 8a7 7 0 1 0 14 0"/><path d="M8 1v5l3-3M8 1l-3 2"/></svg>更換</button>'
    +'<div class="sel-bar-sep"></div>'
    +'<button class="sel-bar-btn danger" onclick="doAction(\'delete\')">'
    +'<svg viewBox="0 0 16 16"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9"/></svg>刪除</button>';

  // 固定在作圖區底部，水平置中，不超出畫布
  var barTop = ZONE.y + ZONE.h + 8;
  // 如果作圖區底部已超出畫布高度，貼齊畫布底部往上
  if(barTop + 42 > H) barTop = H - 50;
  bar.style.left = (ZONE.x + ZONE.w/2) + 'px';
  bar.style.top  = barTop + 'px';
  bar.style.transform = 'translateX(-50%)';
  overlay.appendChild(bar);

  overlay.style.pointerEvents='auto';
}

function doAction(action){
  if(action==='edit'){
    if(window.parent!==window){
      window.parent.postMessage({type:'BN_OPEN_EDITOR', key:'host', src:D.host.src}, '*');
    }

    if(window.parent!==window){
      window.parent.postMessage({type:'BN_REPLACE_IMG', key:'host'}, '*');
    }
  } else if(action==='delete'){

/* ═══════════════════════════════════════════════════════════
   Logo2 UI 系統
   - #logo2-ui：獨立 div 層（z-index:50），不影響主持人 overlay
   - 點擊 logo2 → 選取框 + 8 handles（縮放）+ 拖動（在框內移動）
   - bar：裁切編輯 / 更換 / 刪除
   ═══════════════════════════════════════════════════════════ */
var logo2UI = document.getElementById('logo2-ui');

function updateLogo2UI(){
  logo2UI.innerHTML = '';
  logo2UI.style.pointerEvents = 'none';
  if(!D.logo2 || !_logo2Box) return;
  var b = _logo2Box;

  /* ── 點擊感應區 ── */
  var hit = document.createElement('div');
  hit.style.cssText =
    'position:absolute;left:'+b.x+'px;top:'+b.y+'px;'+
    'width:'+b.w+'px;height:'+b.h+'px;'+
    'cursor:move;z-index:1;pointer-events:auto;';
  hit.addEventListener('mousedown', function(e){
    e.stopPropagation();
    if(e.button !== 0) return;
    if(!_logo2Sel){ _logo2Sel=true; updateLogo2UI(); }
    /* 開始拖動（logo2 在框內移動）*/
    var rect = cv.getBoundingClientRect();
    var ss = W / rect.width;
    _logo2DragData = {
      sx: (e.clientX - rect.left) * ss,
      sy: (e.clientY - rect.top)  * ss,
      ox: _logo2OffX, oy: _logo2OffY
    };
  });
  /* hover 框 */
  hit.addEventListener('mouseenter', function(){
    if(!_logo2Sel) hit.style.outline = '1.5px dashed rgba(37,99,235,0.5)';
  });
  hit.addEventListener('mouseleave', function(){
    if(!_logo2Sel) hit.style.outline = '';
  });
  logo2UI.appendChild(hit);

  if(!_logo2Sel) return;

  /* ── 選取框 ── */
  var selBox = document.createElement('div');
  selBox.style.cssText =
    'position:absolute;left:'+(b.x-2)+'px;top:'+(b.y-2)+'px;'+
    'width:'+(b.w+4)+'px;height:'+(b.h+4)+'px;'+
    'border:2px solid #2563EB;border-radius:4px;'+
    'box-shadow:0 0 0 1px rgba(37,99,235,0.2);pointer-events:none;z-index:2;';
  logo2UI.appendChild(selBox);

  /* ── Resize handles ── */
  [{h:'nw',lx:b.x,       ly:b.y       },{h:'n', lx:b.x+b.w/2, ly:b.y       },
   {h:'ne',lx:b.x+b.w,   ly:b.y       },{h:'e', lx:b.x+b.w,   ly:b.y+b.h/2 },
   {h:'se',lx:b.x+b.w,   ly:b.y+b.h   },{h:'s', lx:b.x+b.w/2, ly:b.y+b.h   },
   {h:'sw',lx:b.x,        ly:b.y+b.h   },{h:'w', lx:b.x,        ly:b.y+b.h/2 },
  ].forEach(function(hd){
    var hel = document.createElement('div');
    hel.className = 'sel-handle';
    hel.dataset.h = hd.h;
    hel.style.cssText = 'left:'+hd.lx+'px;top:'+hd.ly+'px;z-index:5;pointer-events:auto;';
    hel.addEventListener('mousedown', startLogo2Resize);
    logo2UI.appendChild(hel);
  });

  /* ── 懸浮 bar ── */
  var bar = document.createElement('div');
  bar.className = 'sel-bar';
  bar.style.cssText =
    'position:absolute;left:'+(b.x+b.w/2)+'px;top:'+(b.y-8)+'px;'+
    'transform:translateX(-50%) translateY(-100%);z-index:20;pointer-events:auto;';
  if(b.y < 52){
    bar.style.top  = (b.y+b.h+8)+'px';
    bar.style.transform = 'translateX(-50%)';
  }
  bar.innerHTML =
    '<button class="sel-bar-btn" onclick="doLogo2Action(\'edit\')">'
    +'<svg viewBox="0 0 16 16"><path d="M2 14l2-5L12 1l3 3-8 8-5 2z"/><path d="M10 3l3 3"/></svg>裁切編輯</button>'
    +'<div class="sel-bar-sep"></div>'
    +'<button class="sel-bar-btn" onclick="doLogo2Action(\'replace\')">'
    +'<svg viewBox="0 0 16 16"><path d="M1 8a7 7 0 1 0 14 0"/><path d="M8 1v5l3-3M8 1l-3 2"/></svg>更換</button>'
    +'<div class="sel-bar-sep"></div>'
    +'<button class="sel-bar-btn danger" onclick="doLogo2Action(\'delete\')">'
    +'<svg viewBox="0 0 16 16"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9"/></svg>刪除</button>';
  logo2UI.appendChild(bar);
}

/* ── Logo2 Resize ── */
function startLogo2Resize(e){
  e.preventDefault(); e.stopPropagation();
  var b = _logo2Box;
  _logo2RD = {h:e.target.dataset.h, sx:e.clientX, sy:e.clientY, sc:_logo2Scale, bw:b.w, bh:b.h};
}

/* ── Logo2 拖動 + Resize — document 事件 ── */
document.addEventListener('mousemove', function(e){
  /* logo2 resize */
  if(_logo2RD){
    var rect = cv.getBoundingClientRect(), ss = W/rect.width;
    var dx=(e.clientX-_logo2RD.sx)*ss, dy=(e.clientY-_logo2RD.sy)*ss;
    var h=_logo2RD.h, ref=Math.max(_logo2RD.bw, _logo2RD.bh), delta=0;
    if(h==='se'||h==='s'||h==='e') delta= Math.max(dx,dy)/ref;
    if(h==='nw'||h==='n'||h==='w') delta=-Math.min(dx,dy)/ref;
    if(h==='ne') delta=(dx-dy)/ref/2;
    if(h==='sw') delta=-(dx-dy)/ref/2;
    _logo2Scale = Math.max(0.1, _logo2RD.sc+delta);
    render(); return;
  }
  /* logo2 drag（框內移動）*/
  if(_logo2DragData){
    var rect2 = cv.getBoundingClientRect(), ss2 = W/rect2.width;
    var cx = (e.clientX - rect2.left)*ss2;
    var cy = (e.clientY - rect2.top)*ss2;
    _logo2OffX = _logo2DragData.ox + (cx - _logo2DragData.sx);
    _logo2OffY = _logo2DragData.oy + (cy - _logo2DragData.sy);
    render();
  }
});
document.addEventListener('mouseup', function(){
  _logo2RD = null;
  _logo2DragData = null;
});

/* ── Resize ── */
var _rd=null;
function startResize(e){
  e.preventDefault(); e.stopPropagation();
  // 記錄當下的實際寬高和 scale
  var dw = D.host.naturalWidth  * D.imgScale;
  var dh = D.host.naturalHeight * D.imgScale;
  _rd={h:e.target.dataset.h, sx:e.clientX, sy:e.clientY,
       sc:D.imgScale, sw:dw, sh:dh, ix:D.imgX, iy:D.imgY};
  D.resizing=true;
}
document.addEventListener('mousemove',function(e){
  if(!D.resizing||!_rd) return;
  var rect=cv.getBoundingClientRect();
  var stageScale=W/rect.width; // canvas 顯示縮放比
  var dx=(e.clientX-_rd.sx)*stageScale;
  var dy=(e.clientY-_rd.sy)*stageScale;
  var h=_rd.h, ref=Math.max(_rd.sw,_rd.sh);
  var delta=0;
  if(h==='se'||h==='s'||h==='e')  delta= Math.max(dx,dy)/ref;
  if(h==='nw'||h==='n'||h==='w')  delta=-Math.min(dx,dy)/ref;
  if(h==='ne') delta= (dx-dy)/ref/2;
  if(h==='sw') delta=-(dx-dy)/ref/2;
  D.imgScale=Math.max(0.05,_rd.sc+delta);
  render();
});
document.addEventListener('mouseup',function(){ D.resizing=false; _rd=null; });

/* ── Drag ── */
stage.addEventListener('mousedown',function(e){
  if(D.resizing) return;
  if(e.target.classList.contains('sel-handle')||e.target.closest('.sel-bar')) return;
  var rect=cv.getBoundingClientRect();
  var sx=W/rect.width, sy=H/rect.height;
  var cx=(e.clientX-rect.left)*sx, cy=(e.clientY-rect.top)*sy;
  /* 判斷是否點到主持人圖素的有色範圍 */
  var hitOk = false;
  if(D.host){
    if(D.hostBounds){
      var dw=D.host.naturalWidth*D.imgScale, dh=D.host.naturalHeight*D.imgScale;
      var imgL=D.imgX-dw/2, imgT=D.imgY-dh/2;
      var bx=imgL+D.hostBounds.x*D.imgScale;
      var by=imgT+D.hostBounds.y*D.imgScale;
      var bw=D.hostBounds.w*D.imgScale;
      var bh=D.hostBounds.h*D.imgScale;
      hitOk=(cx>=bx&&cx<=bx+bw&&cy>=by&&cy<=by+bh);
    } else {
      /* 沒有 bounds：用整張圖範圍 */
      var dw2=D.host.naturalWidth*D.imgScale, dh2=D.host.naturalHeight*D.imgScale;
      hitOk=(cx>=D.imgX-dw2/2&&cx<=D.imgX+dw2/2&&cy>=D.imgY-dh2/2&&cy<=D.imgY+dh2/2);
    }
  }

  if(hitOk){
    /* 點到圖素：選取並開始拖拉 */
    D.selected=true;
    overlay.style.pointerEvents='auto';
    D.dragging=true;
    D.dragStartX=cx; D.dragStartY=cy;
    D.imgStartX=D.imgX; D.imgStartY=D.imgY;
    stage.style.cursor='grabbing';
  } else {
    /* 點到圖素以外（作圖區內或外）：取消選取 */
    D.selected=false;
    overlay.style.pointerEvents='none';
    stage.style.cursor='default';
  }
  render();
});
stage.addEventListener('mousemove',function(e){
  if(!D.dragging||D.resizing) return;
  var rect=cv.getBoundingClientRect();
  var sx=W/rect.width, sy=H/rect.height;
  D.imgX=D.imgStartX+(e.clientX-rect.left)*sx-D.dragStartX;
  D.imgY=D.imgStartY+(e.clientY-rect.top)*sy-D.dragStartY;
  render();
});
stage.addEventListener('mouseup',function(){ D.dragging=false; stage.style.cursor='default'; });
stage.addEventListener('mouseleave',function(){ D.dragging=false; stage.style.cursor='default'; });

/* ── Tight bounding box：掃描有色像素範圍 ── */
function calcTightBounds(img){
  try{
    var SCAN = 200;
    var sc = Math.min(1, SCAN / Math.max(img.naturalWidth, img.naturalHeight));
    var sw = Math.max(1, Math.floor(img.naturalWidth  * sc));
    var sh = Math.max(1, Math.floor(img.naturalHeight * sc));
    var tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    var tx = tmp.getContext('2d');
    tx.clearRect(0, 0, sw, sh);
    tx.drawImage(img, 0, 0, sw, sh);
    var d = tx.getImageData(0, 0, sw, sh).data;
    var x0=sw, y0=sh, x1=0, y1=0, found=false;
    for(var y=0; y<sh; y++){
      for(var x=0; x<sw; x++){
        if(d[(y*sw+x)*4+3] > 15){
          if(x<x0) x0=x; if(x>x1) x1=x;
          if(y<y0) y0=y; if(y>y1) y1=y;
          found=true;
        }
      }
    }
    if(!found) return null;
    var b={ x:x0/sc, y:y0/sc, w:(x1-x0+1)/sc, h:(y1-y0+1)/sc };
    console.log('[bounds] x='+Math.round(b.x)+' y='+Math.round(b.y)+' w='+Math.round(b.w)+' h='+Math.round(b.h));
    return b;
  } catch(e){ console.warn('[bounds] err:', e.message); return null; }
}

function initHostPos(){
  D.hostBounds = calcTightBounds(D.host);
  if(D.hostBounds){
    /* 有色部分填滿作圖區，再放大 20% */
    var scH = ZONE.h / D.hostBounds.h;
    var scW = ZONE.w / D.hostBounds.w;
    D.imgScale = Math.min(scH, scW) * 1.2;
    /* 最小寬度限制：有色部分至少 263px */
    var MIN_BOUNDS_W = 263;
    var scaleForMinW = MIN_BOUNDS_W / D.hostBounds.w;
    if(scaleForMinW > D.imgScale) D.imgScale = scaleForMinW;
    var dw = D.host.naturalWidth  * D.imgScale;
    var dh = D.host.naturalHeight * D.imgScale;
    /* 水平：有色中心對齊作圖區水平中心 */
    var bcX = D.hostBounds.x * D.imgScale + D.hostBounds.w * D.imgScale / 2;
    D.imgX = ZONE.x + ZONE.w/2 - bcX + dw/2;
    /* 垂直：有色頂部對齊作圖區頂部（頭部不被遮擋） */
    var boundsTop = D.hostBounds.y * D.imgScale;
    D.imgY = ZONE.y - boundsTop + dh/2;
  } else {
    /* 無 bounds 退回 cover */
    D.imgX = ZONE.x + ZONE.w/2;
    D.imgY = ZONE.y + ZONE.h/2;
    D.imgScale = Math.max(ZONE.w/D.host.naturalWidth, ZONE.h/D.host.naturalHeight);
  }
}

/* ── postMessage ── */
window.addEventListener('message',function(e){
  var msg=e.data;
  
  /* 狀態儲存/恢復 */
  if(msg && msg.type==='BN_RESTORE_STATE'){
    var st = msg.state || {};
    if(st.imgX!==undefined) D.imgX = st.imgX;
    if(st.imgY!==undefined) D.imgY = st.imgY;
    if(st.imgScale!==undefined) D.imgScale = st.imgScale;
    /* 恢復 logo2 縮放與偏移 */
    if(st.logo2Scale!==undefined) _logo2Scale = st.logo2Scale;
    if(st.logo2OffX!==undefined)  _logo2OffX  = st.logo2OffX;
    if(st.logo2OffY!==undefined)  _logo2OffY  = st.logo2OffY;
    render(); updateOverlay();
    return;
  }

if(!msg||msg.type!=='BN_UPDATE') return;
  var p=msg.payload;

  if(p.theme!==undefined) D.theme=p.theme;
  if(p.main!==undefined)  D.main=p.main;
  if(p.sub!==undefined)   D.sub=p.sub;
  if(p.date!==undefined)  D.date=p.date;
  if(p.time!==undefined)  D.time=p.time;
  if(p.brand!==undefined) D.brand=p.brand;
  if(p.cSub!==undefined)     D.cSub=p.cSub;
  if(p.cMain!==undefined)    D.cMain=p.cMain;
  if(p.cDate!==undefined)    D.cDate=p.cDate;
  if(p.sepColor!==undefined) D.sepColor=p.sepColor;
  if(p.showCTA!==undefined) D.showCTA=p.showCTA;
  /* bgBase 是資料夾路徑，自己補上版位檔名 */
  var _needBg = false;
  var _bgUrl  = null;
  if(p.bgBase!==undefined){
    _needBg = true;
    _bgUrl  = p.bgBase ? p.bgBase + '01_thumbnail.jpg' : null;
  } else if(p.bgUrl!==undefined){
    _needBg = true;
    _bgUrl  = p.bgUrl || null;
  }

  var pending=0;
  function dec(){
    if(--pending<=0){ render(); _notifyRendered(); }
  }

  /* 把背景載入也納入 pending，確保背景和圖片都載完才 notify */
  if(_needBg){
    pending++;
    var _bgImg = new Image();
    _bgImg.onload = function(){ D.bg=_bgImg; D.bgUrl=_bgUrl; dec(); };
    _bgImg.onerror = function(){ D.bg=null; dec(); };
    if(_bgUrl && _bgUrl!==D.bgUrl){ D.bgUrl=_bgUrl; _bgImg.src=_bgUrl; }
    else if(_bgUrl && D.bg){ dec(); } /* 已快取，直接 dec */
    else { D.bg=null; dec(); }
  }

  if(p.host!==undefined){ pending++;
    var isNew=!D.host||(p.host!==D._lastHostSrc&&!p.keepPos);
    loadImg(p.host,function(img){
      D.host=img;
      if(img&&isNew&&!window._downloadMode){
        D._lastHostSrc=p.host;
        initHostPos(); D.selected=false;
      } else if(img&&isNew){
        D._lastHostSrc=p.host;
        calcTightBounds(img); /* 下載模式：計算 bounds 但不重設位置 */
      }
      else if(img){ D._lastHostSrc=p.host; }
      dec();
    });
  }
  // logo2 可由外部傳入（手動上傳），有傳才更新
  if(p.logo2 !== undefined){ pending++;
    loadImg(p.logo2, function(img){
      D.logo2=img; D._logo2DataUrl=p.logo2;
      _logo2Bounds=img?calcLogo2Bounds(img):null;
      /* 下載模式：不重置縮放，由 BN_RESTORE_STATE 恢復 */
      if(!window._downloadMode){ _logo2Scale=1; _logo2OffX=0; _logo2OffY=0; }
      dec();
    });
  }
  if(pending===0){ render(); _notifyRendered(); }
});

/* ── Export ── */
function snapBlob(fmt, q, cb){
  var ws=D.selected; D.selected=false;
  var ws2=_logo2Sel; _logo2Sel=false; logo2UI.style.display='none';
  render();
  /* 用離屏 canvas 加白底，防止 PNG 輸出出現黑色色塊 */
  var oc = document.createElement('canvas');
  oc.width = cv.width; oc.height = cv.height;
  var ox = oc.getContext('2d');
  ox.fillStyle = '#ffffff';
  ox.fillRect(0, 0, oc.width, oc.height);
  ox.drawImage(cv, 0, 0);
  oc.toBlob(function(blob){
    logo2UI.style.display=''; D.selected=ws; _logo2Sel=ws2; render(); cb(blob);
  }, 'image/'+(fmt||'jpeg'), q||0.75);
}

/* ── UI 參考層切換 ── */
function toggleUILayer(){
  var img = document.getElementById('ui-layer');
  var btn = document.getElementById('ui-toggle');
  if(!img) return;
  var hidden = img.style.display === 'none';
  img.style.display = hidden ? '' : 'none';
  btn.style.opacity = hidden ? '1' : '0.4';
}

window.BNExport = {
  /* 單張輸出（目前狀態） */
  getBlob: function(fmt, q, cb){ snapBlob(fmt, q, cb); },

  /* 輸出兩張：有CTA + 無CTA */
  getBothBlobs: function(fmt, q, cb){
    var origCTA = D.showCTA;
    /* 第一張：有CTA */
    D.showCTA = true; render();
    /* 離屏 canvas 加白底，防黑色色塊 */
    var oc1=document.createElement('canvas'); oc1.width=cv.width; oc1.height=cv.height;
    var ox1=oc1.getContext('2d'); ox1.fillStyle='#ffffff'; ox1.fillRect(0,0,oc1.width,oc1.height); ox1.drawImage(cv,0,0);
    oc1.toBlob(function(blobWith){
      D.showCTA = false; render();
      var oc2=document.createElement('canvas'); oc2.width=cv.width; oc2.height=cv.height;
      var ox2=oc2.getContext('2d'); ox2.fillStyle='#ffffff'; ox2.fillRect(0,0,oc2.width,oc2.height); ox2.drawImage(cv,0,0);
      oc2.toBlob(function(blobWithout){
        D.showCTA = origCTA; render();
        cb(blobWith, blobWithout);
      }, 'image/'+(fmt||'jpeg'), q||0.75);
    }, 'image/'+(fmt||'jpeg'), q||0.75);
  },

  spec:{id:'01_thumbnail', name:'直播時縮圖', width:W, height:H, hasCTAVariant:false, fmt:'jpeg'}
};
