<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>03 FL Icon</title>
<style>:root{ --cw:336px; --ch:120px; }</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="336" height="120"></canvas>
</div>

<script src="../js/layout-common.js?v=20260730"></script>
<script>
'use strict';

var W = 336, H = 120;

/* 左上角固定裝飾icon：logos/fl-b-badge.png，座標直接對應336×120畫布本身
   （不是設計工具裡更大外框量出來的數字），三種版型都會畫在最上層。 */
var BADGE_B = { x:6, y:1, w:44, h:38 };

/* ── 色塊規格 ──
   設計稿給的色塊是 330×98（在 336×120 的畫布裡），四角圓角 49px
   （= 高度的一半，等於左右兩端做成全圓的「膠囊」造型）。
   336-330=6 → 左右各留 3px；120-98=22 → 上下各留 11px，
   不是之前誤用的「四邊都留6px」（那樣算出來的色塊是324×108，
   圓角也會變成54而不是設計稿講的49，這裡一併修正）。 */
var BLOCK = {
  x: 3, y: 11,
  w: 330,
  h: 98,
  r: 0,         // 下面直接算 h/2，見下一行
};
BLOCK.r = BLOCK.h / 2; // 98/2 = 49，跟設計稿給的數字完全對上
var BORDER_W  = 3;          // 橘邊框線寬（往內畫，不往外擴），只有版型L白底模式會用到
var BORDER_COLOR = '#EE4D2D'; // 橘色邊框
var LOGO_BG_COLOR = '#FFFFFF'; // 版型L（純Logo）固定白底，搭配橘色邊框

/* ── 版型P 商品＋文案區 ──
   商品圖示固定64×64、垂直置中（距上緣17px＝(98-64)/2）。
   商品位置跟文字現在改成動態算，不是固定死商品貼死最左邊、文字塞滿剩餘
   寬度──而是「商品＋固定間距＋文字」當一整個區塊，在安全內容範圍（左右
   各留邊界，避開膠囊圓弧兩端）裡置中：文案越短，這一整個區塊就整體越靠
   中間，不會永遠貼在最左邊，商品/文字之間的距離則固定不變（PROD_GAP）。
   文字字級跟版型T一樣的邏輯：預設用最大字級（跟設計稿一致的40px），
   只有文案太長（例如英文字比較多）才等比縮小，正常情況都是最大字級。 */
var PROD_LEFT_INSET  = 30; // 商品左邊安全邊界，避開膠囊左端圓弧（方形直角比圓形更容易看起來超出）
var PROD_RIGHT_INSET = 17; // 文字右邊安全邊界
var PROD_ZONE_W       = 64;  // 商品範圍寬度，維持不變
var PROD_ZONE_H       = 80;  // 商品範圍高度，上下各多擴張8px（原本64→80），左右不動
var PROD_ZONE_TOP     = BLOCK.y + (BLOCK.h - PROD_ZONE_H) / 2; // 垂直置中，高度改了這裡自動跟著算
var PROD_GAP         = 14;  // 商品跟文字保留的固定間距
var PROD_TEXT_MAX_FS = 40;  // 文字最大字級（設計稿數字），超出可用寬度才縮小
/* 版型T 文案區（置中整個色塊） */
var TEXT_ZONE_T = {
  x: BLOCK.x + 14,
  w: BLOCK.w - 28,
  y: BLOCK.y,
  h: BLOCK.h
};
/* 版型L Logo 區：留白只要夠讓Logo不貼到橘框（BORDER_W=3px）就好，不用留多，
   之前隨手抓的12px太保守，Logo看起來填不滿；改成6px，剛好比邊框粗一倍當緩衝。 */
var LOGO_ZONE = {
  x: BLOCK.x + 6,
  y: BLOCK.y + 6,
  w: BLOCK.w - 12,
  h: BLOCK.h - 12
};

/* 跟 editor-logo2-canvas.js 的 LOGO2_WORK_DIM 完全對應（原圖在「Logo2編輯」
   畫布上的工作尺寸），換算偏移量時需要用同一組數字，才能讓 FL 裡的位移比例
   跟編輯畫布一致。 */
var LOGO2_WORK_DIM = { wide: { w:1200, h:540 }, square: { w:735, h:810 } };

/* ── State ── */
var D = {
  bgColor: '#1E6EB4',
  flBTextColor: '#1a1a1a', // 純文案/商品版型專用文字色，跟D.cMain(副標色，公版款式共用)脫鉤
  badgeImg: null, // 左上角固定裝飾icon，跟版型/顏色無關，三種版型都會畫上去
  cSub: '#AD6B00',   // 主標顏色（欄位命名跟顯示標籤是反的，cSub其實對應「主標」色票，這裡FL不用它畫字）
  cMain: '#EE4D2D',  // 副標顏色（同樣命名相反，cMain才是「副標」色票——FL文案顏色要跟著這個）
  flText: '',
  flVariant: 'T',   // 'L' | 'T' | 'P'
  flProduct: null,   // 商品圖 Image 物件（版型P用）
  flProductBounds: null, // 商品圖有色範圍 {x,y,w,h}，來自 calcTightBounds()，忽略透明留白
  logo2: null,       // logo2 Image 物件（版型L用）
  logo2Shape: null,
  logo2RawImg: null,   // 原圖（未合成），優先用這個＋下面的縮放位移直接算，才能跟編輯畫布1:1對應
  logo2Bounds: null,   // 原圖有色範圍 {x,y,w,h}，來自 calcTightBounds()（layout-common.js共用）
  logo2Scale: 1,
  logo2OffX: 0,
  logo2OffY: 0,
  flLogoBgMode: 'white', // 版型L底色類型：'white'=白底+橘框／'colored'=Logo本身有顏色不加框／'sampled'=吸Logo底色填滿
  flLogoSampledColor: '#ffffff', // 'sampled'模式實際要填的顏色
  flLogoExtraScale: 1, // FL示意圖手動額外放大，跟 logo2Scale 分開（見 editor 端註解）
  flLogoExtraOffX: 0,  // 佔 LOGO_ZONE 寬度的比例
  flLogoExtraOffY: 0,  // 佔 LOGO_ZONE 高度的比例
};

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
cv.width  = W; cv.height = H;
cv.style.width  = W + 'px'; cv.style.height = H + 'px';

/* 左上角固定裝飾icon，跟畫布資料狀態無關，載入一次就好 */
loadImg('../logos/fl-b-badge.png', function(img){ D.badgeImg = img; render(); });

/* ── 繪圓角矩形路徑 ── */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

/* ── 等比填滿（cover，置中） ── */
function drawCover(img, x, y, w, h){
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;
  var scale = Math.max(w / iw, h / ih);
  var dw = iw * scale, dh = ih * scale;
  var ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
  ctx.drawImage(img, ox, oy, dw, dh);
}

/* ── 等比 contain（置中，不超出） ── */
function drawContain(img, x, y, w, h){
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;
  var scale = Math.min(w / iw, h / ih);
  var dw = iw * scale, dh = ih * scale;
  var ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
  ctx.drawImage(img, ox, oy, dw, dh);
}

/* 跟 drawContain 一樣是「等比縮到剛好塞得下、不超出範圍」，差別是這裡用
   b（tight bounds，只有有色/不透明的範圍）當素材來源，不是整張原圖——
   商品圖常常四周留有透明留白，直接用整張圖contain，留白也會被當成「圖的
   一部分」一起等比縮放，實際商品本體反而縮得比範圍還小；改成先框出有色
   範圍再等比塞滿，商品本體才會真的貼齊範圍的最大尺寸。 */
function drawContainBounds(img, b, x, y, w, h){
  if(!b || !b.w || !b.h) { drawContain(img, x, y, w, h); return; }
  var scale = Math.min(w / b.w, h / b.h);
  var dw = b.w * scale, dh = b.h * scale;
  var dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
  ctx.drawImage(img, b.x, b.y, b.w, b.h, dx, dy, dw, dh);
}

/* 只算「等比縮到剛好塞進 maxW×maxH 之後的實際寬高」，不畫圖。
   用途：版型P要先知道商品縮小後「實際」有多寬，才能正確算文字要從哪裡
   開始、商品+文字整組的總寬度是多少——細長型商品實際寬度遠小於maxW，
   如果排版邏輯還是照maxW去扣，商品跟文字中間就會空出一大截沒用到的
   空白（明明圖只有一半寬，右邊卻硬留滿版寬度的間距）。 */
function fitSize(b, maxW, maxH){
  if(!b || !b.w || !b.h) return { w: maxW, h: maxH };
  var scale = Math.min(maxW / b.w, maxH / b.h);
  return { w: b.w * scale, h: b.h * scale };
}

/* 量出 fillTextTight() 實際會畫出來的寬度（含縮緊的字距），
   跟 fillTextTight() 用同一套算法，量測／繪製才不會兜不起來。
   呼叫前要先設定好 ctx.font。 */
function measureTightWidth(text, spacing){
  text = text || '';
  if(!text) return 0;
  var chars = text.split('');
  var widths = chars.map(function(c){ return ctx.measureText(c).width; });
  return widths.reduce(function(a,b){ return a + b; }, 0) + spacing * (chars.length - 1);
}

/* ── 縮減字距的文字置中繪製 ──
   canvas 原生 fillText 沒有字距可以調，這裡逐字量寬度自己排版，
   每個字之間再扣掉 spacing（負值＝縮緊），畫完後整串仍水平置中在 cx。
   呼叫前要先設定好 ctx.font／ctx.fillStyle，textBaseline建議用middle。 */
function fillTextTight(text, cx, cy, spacing){
  text = text || '';
  if(!text){ return; }
  var chars = text.split('');
  var widths = chars.map(function(c){ return ctx.measureText(c).width; });
  var totalWidth = widths.reduce(function(a,b){ return a + b; }, 0) + spacing * (chars.length - 1);
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  var x = cx - totalWidth / 2;
  for(var i = 0; i < chars.length; i++){
    ctx.fillText(chars[i], x, cy);
    x += widths[i] + spacing;
  }
  ctx.textAlign = prevAlign;
}

/* ── 主繪製 ── */
function render(){
  ctx.clearRect(0, 0, W, H);

  var b = BLOCK;
  var isLogoVariant = (D.flVariant === 'L');
  /* 版型L底下分兩種底色類型：
     white   ── 白底＋橘框（黑字/單色Logo，靠白底橘框襯托可見度）；
     sampled ── Logo本身已有顏色，吸取Logo素材本身的底色來填滿，不加框
                （底色已經跟Logo是同一套顏色，不需要橘框再框一次）。
     （曾經多加過一個「完全透明不畫背景」的選項，後來確認那個理解是錯的，
     已經拿掉；這裡對任何不是'white'的值一律當'sampled'處理，包含舊資料
     殘留的值，安全起見不要讓畫面掉進沒有背景可畫的狀態。） */
  var flMode = isLogoVariant ? (D.flLogoBgMode || 'white') : null;
  var isWhiteLogo   = flMode === 'white';
  var isSampledLogo = isLogoVariant && !isWhiteLogo;

  /* 1. 背景色塊（圓角，clip 用）
     版型L＋白底模式：固定白底，不跟著背景色變，Logo才不會被深色背景蓋掉；
     版型L＋吸色模式：用從Logo素材吸出來的顏色填滿；
     版型T／P（文字／商品圖）：跟其他版位（如02）共用同一顆背景色。 */
  ctx.save();
  roundRect(b.x, b.y, b.w, b.h, b.r);
  if(isWhiteLogo){
    ctx.fillStyle = LOGO_BG_COLOR;
  } else if(isSampledLogo){
    ctx.fillStyle = D.flLogoSampledColor || LOGO_BG_COLOR;
  } else {
    ctx.fillStyle = D.bgColor || '#1E6EB4';
  }
  ctx.fill();

  /* 2. 依版型繪製內容（在色塊 clip 範圍內） */
  ctx.clip();

  if(D.flVariant === 'L'){
    drawVariantL();
  } else if(D.flVariant === 'P'){
    drawVariantP();
  } else {
    drawVariantT();
  }

  ctx.restore();

  /* 3. 橘色邊框：只有版型L＋白底模式才需要，其餘版型/Logo已有顏色的情況跟著背景色
     融為一體、不加框（在 clip 外面畫，才不會被裁掉；往內縮 BORDER_W/2 確保不超出色塊） */
  if(isWhiteLogo){
    var bw2 = BORDER_W / 2;
    roundRect(b.x + bw2, b.y + bw2, b.w - BORDER_W, b.h - BORDER_W, b.r - bw2);
    ctx.strokeStyle = BORDER_COLOR;
    ctx.lineWidth   = BORDER_W;
    ctx.stroke();
  }

  /* 4. 左上角固定裝飾icon：畫在最上層，三種版型（L/T/P）都會顯示 */
  if(D.badgeImg) ctx.drawImage(D.badgeImg, BADGE_B.x, BADGE_B.y, BADGE_B.w, BADGE_B.h);
}

/* ── 版型 L：純 Logo ──
   優先用「原圖＋使用者在 Logo2 編輯畫布調的縮放/位移」直接算位置大小，
   公式跟 editor-logo2-canvas.js 的 drawLogo2BigCanvas() 完全對應：
     sclBase：LOGO_ZONE 跟原圖「有色範圍」的自動貼合比例（等比縮到剛好塞滿）
     scl = sclBase × 使用者調的縮放倍數 → 在編輯畫布放大多少，這裡就放大多少
     位移：使用者在編輯畫布拖曳的量，換算成「佔編輯畫布寬/高的比例」，
           再乘上 LOGO_ZONE 自己的寬/高 → 偏移比例一致，畫布多小都對得上
           （不能直接套用原始px位移，因為編輯畫布跟LOGO_ZONE尺寸差很多倍）
   沒有原圖資訊時（例如舊存檔還沒帶這些欄位）才退回舊做法：直接把合成好
   的白底小卡整張 contain 進 LOGO_ZONE。 */
function drawVariantL(){
  var z = LOGO_ZONE;
  if(D.logo2RawImg && D.logo2Bounds && D.logo2Bounds.w && D.logo2Bounds.h){
    var b = D.logo2Bounds;
    var workDim = LOGO2_WORK_DIM[D.logo2Shape] || LOGO2_WORK_DIM.wide;

    /* 跟 Logo2 編輯畫布用完全同一套公式，只是「自動貼合的基準」換成 FL 自己
       這個 LOGO_ZONE 的寬高（編輯畫布是 Math.min(workDim.w/b.w, workDim.h/b.h)，
       這裡對應換成 Math.min(z.w/b.w, z.h/b.h)），使用者在編輯畫布調的縮放倍率
       （_logo2Scale）直接原數字乘上去──放大倍率跟編輯畫布是同一個數字，
       不是另外發明一套「一定要填滿高度」之類的規則。
       位移量則是「佔編輯畫布寬/高的比例」，換算成 FL 這裡的寬/高等比套用，
       因為兩邊畫布尺寸差很多倍，位移不能直接套用原始px。 */
    var sclBase = Math.min(z.w / b.w, z.h / b.h);
    /* logo2Scale：Logo2編輯畫布本身的縮放；flLogoExtraScale：FL示意圖另外手動加的
       「額外放大」，兩個相乘——因為logo2畫布跟FL長寬比不一樣，光靠logo2那組數字
       有時候怎麼調都填不滿FL，所以留一個獨立的旋鈕給使用者在FL這邊自己再調。 */
    var scl = sclBase * (D.logo2Scale || 1) * (D.flLogoExtraScale || 1);
    var dw = b.w * scl, dh = b.h * scl;
    var offXRatio = (D.logo2OffX || 0) / workDim.w;
    var offYRatio = (D.logo2OffY || 0) / workDim.h;
    var dx = z.x + (z.w - dw) / 2 + offXRatio * z.w + (D.flLogoExtraOffX || 0) * z.w;
    var dy = z.y + (z.h - dh) / 2 + offYRatio * z.h + (D.flLogoExtraOffY || 0) * z.h;
    ctx.drawImage(D.logo2RawImg, b.x, b.y, b.w, b.h, dx, dy, dw, dh);
    return;
  }
  if(!D.logo2) return;
  drawContain(D.logo2, z.x, z.y, z.w, z.h);
}

/* ── 版型 T：純文案，水平垂直置中 ── */
function drawVariantT(){
  var z = TEXT_ZONE_T;
  var text = D.flText || '';
  var spacing = -2; // 字距縮緊一點點，跟版型P用同一個值
  var fs = 48; // 文字最大字級，文案太長塞不下時仍會自動等比縮小
  ctx.font = font(fs, 500);
  ctx.fillStyle = D.flBTextColor || '#1a1a1a'; // B級FL Icon專用文字色，跟公版款式的副標色(cMain)脫鉤
  /* 字級固定48px在文案偏長、或混雜英數符號時（英數比較窄但視覺上還是佔格），
     量出來的寬度常常超出色塊，導致文字被裁掉看不全。這裡量一次寬度，
     超出可用寬度就照比例縮小字級，短文案不受影響（維持原本48px滿版大小）。 */
  var tw = measureTightWidth(text, spacing);
  if(tw > z.w){
    fs = fs * (z.w / tw);
    ctx.font = font(fs, 500);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fillTextTight(text, z.x + z.w / 2, z.y + z.h / 2, spacing);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ── 版型 P：商品圖（64×64方形icon）＋ 文案，兩個一組動態置中 ── */
function drawVariantP(){
  var contentLeft  = BLOCK.x + PROD_LEFT_INSET;
  var contentRight = BLOCK.x + BLOCK.w - PROD_RIGHT_INSET;
  var availableW   = contentRight - contentLeft;
  var spacing = -2; // 字距縮緊一點點，跟 fillTextTight 的間距保持一致

  /* 商品實際會畫出來的寬高（等比縮到剛好塞進 PROD_ZONE_W×PROD_ZONE_H，
     細長型商品這裡量出來的寬度會比64小很多）。沒有商品圖時當作滿版64處理，
     維持版面穩定，不會因為圖片還沒載入完成就整排跳動。 */
  var prodW = PROD_ZONE_W, prodH = PROD_ZONE_H;
  if(D.flProduct){
    var fitted = fitSize(D.flProductBounds, PROD_ZONE_W, PROD_ZONE_H);
    prodW = fitted.w; prodH = fitted.h;
  }

  var text = D.flText || '';
  var fs = PROD_TEXT_MAX_FS;
  ctx.font = font(fs, 500);
  var tw = measureTightWidth(text, spacing);

  /* 文字最大可用寬度＝扣掉「商品實際寬度」＋固定間距後剩下的空間——
     細長商品實際寬度比64小很多，這裡改用實際寬度算，商品旁邊才不會
     多空出一大截根本沒用到的留白，超出才等比縮小字級。 */
  var maxTextW = availableW - prodW - PROD_GAP;
  if(tw > maxTextW && maxTextW > 0){
    fs = fs * (maxTextW / tw);
    ctx.font = font(fs, 500);
    tw = measureTightWidth(text, spacing);
  }

  /* 商品＋固定間距＋文字，當一整個區塊在安全範圍內置中——
     文案越短，總寬度越小，這一整區塊就整體越靠中間。 */
  var totalW = prodW + PROD_GAP + tw;
  var startX = contentLeft + Math.max(0, (availableW - totalW) / 2);

  if(D.flProduct){
    /* 商品貼著 startX 畫，寬度就是量出來的實際寬度（不用再置中進一個虛擬
       的64寬框，那樣反而會把細長圖往框中央推，跟文字的間距又拉開了）；
       高度不足64的部分（例如寬扁型商品）在直向的商品區內置中。 */
    var prodY = PROD_ZONE_TOP + (PROD_ZONE_H - prodH) / 2;
    var b = D.flProductBounds;
    if(b && b.w && b.h){
      ctx.drawImage(D.flProduct, b.x, b.y, b.w, b.h, startX, prodY, prodW, prodH);
    } else {
      drawContain(D.flProduct, startX, PROD_ZONE_TOP, PROD_ZONE_W, PROD_ZONE_H);
    }
  }

  var textCenterX = startX + prodW + PROD_GAP + tw / 2;
  ctx.fillStyle = D.flBTextColor || '#1a1a1a'; // B級FL Icon專用文字色，跟公版款式的副標色(cMain)脫鉤
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fillTextTight(text, textCenterX, BLOCK.y + BLOCK.h / 2, spacing);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ── BN_UPDATE ── */
window.addEventListener('message', function(e){
  var msg = e.data;
  if(!msg) return;

  /* canvas位置還原（拖曳位移，FL沒有可拖曳素材所以接到就忽略） */
  if(msg.type === 'BN_RESTORE_STATE') return;

  if(!msg || msg.type !== 'BN_UPDATE') return;
  var p = msg.payload;

  if(p.flBBgColor !== undefined) D.bgColor  = p.flBBgColor;
  if(p.flBTextColor !== undefined) D.flBTextColor = p.flBTextColor;
  if(p.cSub     !== undefined) D.cSub     = p.cSub;
  if(p.cMain    !== undefined) D.cMain    = p.cMain;
  if(p.flLogoBgMode !== undefined) D.flLogoBgMode = p.flLogoBgMode;
  if(p.flLogoSampledColor !== undefined) D.flLogoSampledColor = p.flLogoSampledColor;
  if(p.flLogoExtraScale !== undefined) D.flLogoExtraScale = p.flLogoExtraScale;
  if(p.flLogoExtraOffX  !== undefined) D.flLogoExtraOffX  = p.flLogoExtraOffX;
  if(p.flLogoExtraOffY  !== undefined) D.flLogoExtraOffY  = p.flLogoExtraOffY;

  /* 解析 flText → 判斷版型 */
  if(p.flText !== undefined){
    var raw = String(p.flText || '').trim();
    if(raw.toLowerCase() === 'logo'){
      D.flVariant = 'L';
      D.flText    = '';
    } else if(p.flProduct !== undefined && p.flProduct !== null){
      D.flVariant = 'P';
      D.flText    = raw;
    } else {
      D.flVariant = 'T';
      D.flText    = raw;
    }
  }

  /* logo2：版型L使用。
     這裡刻意「不要」在載入 p.logo2 之後 return——舊寫法 return 會導致同一個
     BN_UPDATE 訊息裡如果剛好也帶了 flProduct（broadcastFull 每次都兩個一起送），
     商品圖那段程式碼直接被跳過、完全沒機會執行，商品圖因此可能「有時候套不上」。
     改成每個欄位各自獨立處理、各自需要非同步載入的就各自在載入完成後 render()，
     不會互相卡住。 */
  if(p.logo2Shape !== undefined) D.logo2Shape = p.logo2Shape;
  if(p.logo2Scale !== undefined) D.logo2Scale = p.logo2Scale;
  if(p.logo2OffX  !== undefined) D.logo2OffX  = p.logo2OffX;
  if(p.logo2OffY  !== undefined) D.logo2OffY  = p.logo2OffY;

  var needsSyncRender = true; // 沒有任何非同步載入時，最後統一 render() 一次

  /* 原圖＋縮放位移：優先用這組直接算，才能跟 Logo2 編輯畫布1:1對應
     （放大就放大、偏左偏右就偏左偏右），細節見 drawVariantL()。 */
  if(p.logo2Raw !== undefined && p.logo2Raw && p.logo2Raw !== D._logo2RawCacheSrc){
    D._logo2RawCacheSrc = p.logo2Raw;
    needsSyncRender = false;
    var _logo2RawSrcAtRequest = p.logo2Raw;
    loadImg(p.logo2Raw, function(img){
      D.logo2RawImg = img;
      D.logo2Bounds = img ? (calcTightBounds(img) || { x:0, y:0, w:img.naturalWidth, h:img.naturalHeight }) : null;
      render();
      /* 這張logo2原圖真的畫上去了，回報給editor（js/editor-export.js的
         waitForLogo2Ready）：整包下載不用再猜「應該等多久」，等這個訊息
         到了才截圖，圖片再大、分頁再多都不會因為猜的時間不夠而截到舊畫面。 */
      window.parent.postMessage({ type:'BN_LOGO2_READY', layoutId:'03_fl', src:_logo2RawSrcAtRequest }, '*');
    });
  } else if(p.logo2Raw !== undefined && p.logo2Raw && p.logo2Raw === D._logo2RawCacheSrc){
    /* 同一張圖之前已經載入過（例如同一個分頁被重新廣播），畫面早就是最新的了，
       直接回報ready，不用讓editor那邊白等一次timeout才截圖。 */
    window.parent.postMessage({ type:'BN_LOGO2_READY', layoutId:'03_fl', src:p.logo2Raw }, '*');
  }

  /* 合成好的白底小卡：沒有原圖資訊時的備援畫法用（見 drawVariantL） */
  if(p.logo2 !== undefined && p.logo2 && p.logo2 !== D._logo2CacheSrc){
    D._logo2CacheSrc = p.logo2;
    needsSyncRender = false;
    loadImg(p.logo2, function(img){ D.logo2 = img; render(); });
  }

  /* flProduct：版型P使用，值是 product1/2/3 的 dataUrl */
  if(p.flProduct !== undefined){
    if(p.flProduct){
      needsSyncRender = false;
      loadImg(p.flProduct, function(img){
        D.flProduct = img;
        D.flProductBounds = img ? (calcTightBounds(img) || { x:0, y:0, w:img.naturalWidth, h:img.naturalHeight }) : null;
        render();
      });
    } else {
      D.flProduct = null;
      D.flProductBounds = null;
    }
  }

  if(needsSyncRender) render();
});

/* ── BN_READY：通知 editor 這個 iframe 已就緒 ── */
window.parent.postMessage({ type: 'BN_READY' }, '*');

/* ── Export ── */
function exportBlob(fmt, q, cb){
  var out = document.createElement('canvas');
  out.width = W; out.height = H;
  /* 保留透明底：不預填白色，直接合成 */
  out.getContext('2d').drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, W, H);
  out.toBlob(cb, 'image/png'); // FL icon 永遠輸出 PNG（有透明底）
}

/* editor 端的下載邏輯（js/editor-export.js 的 _downloadSingle／downloadAll）
   一律透過 iframe 的 window.BNExport 拿 getBlob／spec，不是直接呼叫
   exportBlob()——這裡漏掉沒註冊，下載時 iframe.contentWindow.BNExport
   會是 undefined，跳出「畫布尚未就緒」的錯誤，整包下載也會漏掉這張。
   FL沒有可拖曳/選取的素材，不需要像02_lpbn那樣在匯出前先取消選取。 */
window.BNExport = {
  getBlob: function(fmt, q, cb){ exportBlob(fmt, q, cb); },
  spec: { id: '03_fl', name: 'FL-Icon-336x120', width: W, height: H, hasCTAVariant: false, fmt: 'png' }
};

</script>
</body>
</html>
