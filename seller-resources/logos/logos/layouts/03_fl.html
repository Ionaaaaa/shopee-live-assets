<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>03 FL Icon</title>
<style>:root{ --cw:336px; --ch:120px; }</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="336" height="120"></canvas>
</div>

<script src="../js/layout-common.js"></script>
<script>
'use strict';

var W = 336, H = 120;

/* ── 色塊規格 ──
   設計稿給的色塊是 330×98（在 336×120 的畫布裡），四角圓角 49px
   （= 高度的一半，等於左右兩端做成全圓的「膠囊」造型）。
   336-330=6 → 左右各留 3px；120-98=22 → 上下各留 11px，
   不是之前誤用的「四邊都留6px」（那樣算出來的色塊是324×108，
   圓角也會變成54而不是設計稿講的49，這裡一併修正）。 */
var BLOCK = {
  x: 3, y: 11,
  w: 330,
  h: 98,
  r: 0,         // 下面直接算 h/2，見下一行
};
BLOCK.r = BLOCK.h / 2; // 98/2 = 49，跟設計稿給的數字完全對上
var BORDER_W  = 3;          // 橘邊框線寬（往內畫，不往外擴），只有版型L白底模式會用到
var BORDER_COLOR = '#EE4D2D'; // 橘色邊框
var LOGO_BG_COLOR = '#FFFFFF'; // 版型L（純Logo）固定白底，搭配橘色邊框

/* ── 版型P 商品＋文案區 ──
   數字來自設計稿實測（商品範圍64×64、文字起點），配色塊本身330×98換算：
     商品圖示：距色塊上邊 17px（剛好等於「(98-64)/2=17」，代表商品圖示
               在色塊裡是垂直置中的，不是貼齊上緣）
     商品圖示到文字：實測間距約14px
     文字區：延伸到色塊右邊，右邊界比照左邊也留17px，維持左右視覺對稱
   左邊距原本也是17px，但色塊是膠囊造型（圓角=高度一半），左端整段是
   半圓，17px還在圓弧範圍內，商品圖示是直角方形，貼太近會讓角超出圓弧
   看起來像「跑出邊框」，所以左邊距另外加7px緩衝，跟上邊距（垂直置中用）
   分開算，不要互相牽動。 */
var PROD_LEFT_INSET = 30; // 再往右多6px（原本24px緩衝還是有點貼邊）
var PROD_ZONE = {
  x: BLOCK.x + PROD_LEFT_INSET,
  y: BLOCK.y + 17,
  w: 64,
  h: 64
};
var PROD_TEXT_GAP = 14;
/* 版型P 文案區（商品右側，垂直置中整個色塊高度） */
var TEXT_ZONE_P = {
  x: PROD_ZONE.x + PROD_ZONE.w + PROD_TEXT_GAP,
  y: BLOCK.y,
  w: (BLOCK.x + BLOCK.w - 17) - (PROD_ZONE.x + PROD_ZONE.w + PROD_TEXT_GAP),
  h: BLOCK.h
};
/* 版型T 文案區（置中整個色塊） */
var TEXT_ZONE_T = {
  x: BLOCK.x + 12,
  w: BLOCK.w - 24,
  y: BLOCK.y,
  h: BLOCK.h
};
/* 版型L Logo 區：留白只要夠讓Logo不貼到橘框（BORDER_W=3px）就好，不用留多，
   之前隨手抓的12px太保守，Logo看起來填不滿；改成6px，剛好比邊框粗一倍當緩衝。 */
var LOGO_ZONE = {
  x: BLOCK.x + 6,
  y: BLOCK.y + 6,
  w: BLOCK.w - 12,
  h: BLOCK.h - 12
};

/* 跟 editor-logo2-canvas.js 的 LOGO2_WORK_DIM 完全對應（原圖在「Logo2編輯」
   畫布上的工作尺寸），換算偏移量時需要用同一組數字，才能讓 FL 裡的位移比例
   跟編輯畫布一致。 */
var LOGO2_WORK_DIM = { wide: { w:1200, h:540 }, square: { w:735, h:810 } };

/* ── State ── */
var D = {
  bgColor: '#1E6EB4',
  cSub: '#AD6B00',   // 文案顏色（跟主標色同步）
  flText: '',
  flVariant: 'T',   // 'L' | 'T' | 'P'
  flProduct: null,   // 商品圖 Image 物件（版型P用）
  logo2: null,       // logo2 Image 物件（版型L用）
  logo2Shape: null,
  logo2RawImg: null,   // 原圖（未合成），優先用這個＋下面的縮放位移直接算，才能跟編輯畫布1:1對應
  logo2Bounds: null,   // 原圖有色範圍 {x,y,w,h}，來自 calcTightBounds()（layout-common.js共用）
  logo2Scale: 1,
  logo2OffX: 0,
  logo2OffY: 0,
  flLogoIsWhite: true, // 版型L：true=白底+橘框（黑字/單色Logo），false=Logo本身有顏色，不加框、不受bgColor影響
  flLogoExtraScale: 1, // FL示意圖手動額外放大，跟 logo2Scale 分開（見 editor 端註解）
  flLogoExtraOffX: 0,  // 佔 LOGO_ZONE 寬度的比例
  flLogoExtraOffY: 0,  // 佔 LOGO_ZONE 高度的比例
};

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
cv.width  = W; cv.height = H;
cv.style.width  = W + 'px'; cv.style.height = H + 'px';

/* ── 繪圓角矩形路徑 ── */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

/* ── 等比填滿（cover，置中） ── */
function drawCover(img, x, y, w, h){
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;
  var scale = Math.max(w / iw, h / ih);
  var dw = iw * scale, dh = ih * scale;
  var ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
  ctx.drawImage(img, ox, oy, dw, dh);
}

/* ── 等比 contain（置中，不超出） ── */
function drawContain(img, x, y, w, h){
  var iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;
  var scale = Math.min(w / iw, h / ih);
  var dw = iw * scale, dh = ih * scale;
  var ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
  ctx.drawImage(img, ox, oy, dw, dh);
}

/* ── 縮減字距的文字置中繪製 ──
   canvas 原生 fillText 沒有字距可以調，這裡逐字量寬度自己排版，
   每個字之間再扣掉 spacing（負值＝縮緊），畫完後整串仍水平置中在 cx。
   呼叫前要先設定好 ctx.font／ctx.fillStyle，textBaseline建議用middle。 */
function fillTextTight(text, cx, cy, spacing){
  text = text || '';
  if(!text){ return; }
  var chars = text.split('');
  var widths = chars.map(function(c){ return ctx.measureText(c).width; });
  var totalWidth = widths.reduce(function(a,b){ return a + b; }, 0) + spacing * (chars.length - 1);
  var prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  var x = cx - totalWidth / 2;
  for(var i = 0; i < chars.length; i++){
    ctx.fillText(chars[i], x, cy);
    x += widths[i] + spacing;
  }
  ctx.textAlign = prevAlign;
}

/* ── 主繪製 ── */
function render(){
  ctx.clearRect(0, 0, W, H);

  var b = BLOCK;
  var isLogoVariant  = (D.flVariant === 'L');
  /* 版型L底下再分兩種：
     白底＋橘框（黑字/單色Logo，靠白底橘框襯托可見度）── 走 clip+背景+邊框那一套；
     Logo本身有顏色（已經有自己的品牌色/底色）── 完全不畫背景、不加框、
     也不受畫布背景色（D.bgColor）影響，直接把 Logo 擺上去就好。 */
  var isWhiteLogo    = isLogoVariant && (D.flLogoIsWhite !== false);
  var isColoredLogo  = isLogoVariant && !isWhiteLogo;

  if(isColoredLogo){
    /* 不畫背景色塊、不加邊框，但還是要裁切在色塊的膠囊形狀範圍內——
       改成「高度填滿」當預設後，比較寬的 Logo 寬度可能會超出範圍，
       裁切掉超出的部分，才不會整個溢出到 FL 色塊本體的視覺邊界外面。 */
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, b.r);
    ctx.clip();
    drawVariantL();
    ctx.restore();
    return;
  }

  /* 1. 背景色塊（圓角，clip 用）
     版型L＋白底模式：固定白底，不跟著背景色變，Logo才不會被深色背景蓋掉；
     版型T／P（文字／商品圖）：跟其他版位（如02）共用同一顆背景色，不畫邊框。 */
  ctx.save();
  roundRect(b.x, b.y, b.w, b.h, b.r);
  ctx.fillStyle = isWhiteLogo ? LOGO_BG_COLOR : (D.bgColor || '#1E6EB4');
  ctx.fill();

  /* 2. 依版型繪製內容（在色塊 clip 範圍內） */
  ctx.clip();

  if(D.flVariant === 'L'){
    drawVariantL();
  } else if(D.flVariant === 'P'){
    drawVariantP();
  } else {
    drawVariantT();
  }

  ctx.restore();

  /* 3. 橘色邊框：只有版型L＋白底模式才需要，其餘版型/Logo已有顏色的情況跟著背景色
     融為一體、不加框（在 clip 外面畫，才不會被裁掉；往內縮 BORDER_W/2 確保不超出色塊） */
  if(isWhiteLogo){
    var bw2 = BORDER_W / 2;
    roundRect(b.x + bw2, b.y + bw2, b.w - BORDER_W, b.h - BORDER_W, b.r - bw2);
    ctx.strokeStyle = BORDER_COLOR;
    ctx.lineWidth   = BORDER_W;
    ctx.stroke();
  }
}

/* ── 版型 L：純 Logo ──
   優先用「原圖＋使用者在 Logo2 編輯畫布調的縮放/位移」直接算位置大小，
   公式跟 editor-logo2-canvas.js 的 drawLogo2BigCanvas() 完全對應：
     sclBase：LOGO_ZONE 跟原圖「有色範圍」的自動貼合比例（等比縮到剛好塞滿）
     scl = sclBase × 使用者調的縮放倍數 → 在編輯畫布放大多少，這裡就放大多少
     位移：使用者在編輯畫布拖曳的量，換算成「佔編輯畫布寬/高的比例」，
           再乘上 LOGO_ZONE 自己的寬/高 → 偏移比例一致，畫布多小都對得上
           （不能直接套用原始px位移，因為編輯畫布跟LOGO_ZONE尺寸差很多倍）
   沒有原圖資訊時（例如舊存檔還沒帶這些欄位）才退回舊做法：直接把合成好
   的白底小卡整張 contain 進 LOGO_ZONE。 */
function drawVariantL(){
  var z = LOGO_ZONE;
  if(D.logo2RawImg && D.logo2Bounds && D.logo2Bounds.w && D.logo2Bounds.h){
    var b = D.logo2Bounds;
    var workDim = LOGO2_WORK_DIM[D.logo2Shape] || LOGO2_WORK_DIM.wide;

    /* 跟 Logo2 編輯畫布用完全同一套公式，只是「自動貼合的基準」換成 FL 自己
       這個 LOGO_ZONE 的寬高（編輯畫布是 Math.min(workDim.w/b.w, workDim.h/b.h)，
       這裡對應換成 Math.min(z.w/b.w, z.h/b.h)），使用者在編輯畫布調的縮放倍率
       （_logo2Scale）直接原數字乘上去──放大倍率跟編輯畫布是同一個數字，
       不是另外發明一套「一定要填滿高度」之類的規則。
       位移量則是「佔編輯畫布寬/高的比例」，換算成 FL 這裡的寬/高等比套用，
       因為兩邊畫布尺寸差很多倍，位移不能直接套用原始px。 */
    var sclBase = Math.min(z.w / b.w, z.h / b.h);
    /* logo2Scale：Logo2編輯畫布本身的縮放；flLogoExtraScale：FL示意圖另外手動加的
       「額外放大」，兩個相乘——因為logo2畫布跟FL長寬比不一樣，光靠logo2那組數字
       有時候怎麼調都填不滿FL，所以留一個獨立的旋鈕給使用者在FL這邊自己再調。 */
    var scl = sclBase * (D.logo2Scale || 1) * (D.flLogoExtraScale || 1);
    var dw = b.w * scl, dh = b.h * scl;
    var offXRatio = (D.logo2OffX || 0) / workDim.w;
    var offYRatio = (D.logo2OffY || 0) / workDim.h;
    var dx = z.x + (z.w - dw) / 2 + offXRatio * z.w + (D.flLogoExtraOffX || 0) * z.w;
    var dy = z.y + (z.h - dh) / 2 + offYRatio * z.h + (D.flLogoExtraOffY || 0) * z.h;
    ctx.drawImage(D.logo2RawImg, b.x, b.y, b.w, b.h, dx, dy, dw, dh);
    return;
  }
  if(!D.logo2) return;
  drawContain(D.logo2, z.x, z.y, z.w, z.h);
}

/* ── 版型 T：純文案，水平垂直置中 ── */
function drawVariantT(){
  var z = TEXT_ZONE_T;
  var text = D.flText || '';
  var fs = 67; // 50pt × (96/72) ≈ 67px，設計稿給的字級，6個全形字剛好塞滿
  ctx.font = font(fs, 500);
  ctx.fillStyle = D.cSub || '#1a1a1a';
  /* 字級固定67px在文案偏長、或混雜英數符號時（英數比較窄但視覺上還是佔格），
     量出來的寬度常常超出色塊，導致文字被裁掉看不全。這裡量一次寬度，
     超出可用寬度就照比例縮小字級，短文案不受影響（維持原本67px滿版大小）。 */
  var tw = ctx.measureText(text).width;
  if(tw > z.w){
    fs = fs * (z.w / tw);
    ctx.font = font(fs, 500);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, z.x + z.w / 2, z.y + z.h / 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ── 版型 P：商品圖（左側 64×64 方形 icon，cover 填滿）＋ 文案（右側置中） ── */
function drawVariantP(){
  /* 商品圖：固定 64×64 小方塊（不是滿版高度），cover 裁切填滿（clip 已由外層色塊套用） */
  if(D.flProduct){
    var pz = PROD_ZONE;
    drawCover(D.flProduct, pz.x, pz.y, pz.w, pz.h);
  }
  /* 文案：右側區塊垂直水平置中，字級跟設計稿一致（40px）。
     字距縮緊一點點（-2px）——原本用 fillText 直接畫，字跟字之間間距偏鬆。 */
  var tz = TEXT_ZONE_P;
  var fs = 40;
  ctx.font = font(fs, 500);
  ctx.fillStyle = D.cSub || '#1a1a1a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fillTextTight(D.flText || '', tz.x + tz.w / 2, tz.y + tz.h / 2, -2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ── BN_UPDATE ── */
window.addEventListener('message', function(e){
  var msg = e.data;
  if(!msg) return;

  /* canvas位置還原（拖曳位移，FL沒有可拖曳素材所以接到就忽略） */
  if(msg.type === 'BN_RESTORE_STATE') return;

  if(!msg || msg.type !== 'BN_UPDATE') return;
  var p = msg.payload;

  if(p.bgColor  !== undefined) D.bgColor  = p.bgColor;
  if(p.cSub     !== undefined) D.cSub     = p.cSub;
  if(p.flLogoIsWhite !== undefined) D.flLogoIsWhite = (p.flLogoIsWhite !== false);
  if(p.flLogoExtraScale !== undefined) D.flLogoExtraScale = p.flLogoExtraScale;
  if(p.flLogoExtraOffX  !== undefined) D.flLogoExtraOffX  = p.flLogoExtraOffX;
  if(p.flLogoExtraOffY  !== undefined) D.flLogoExtraOffY  = p.flLogoExtraOffY;

  /* 解析 flText → 判斷版型 */
  if(p.flText !== undefined){
    var raw = String(p.flText || '').trim();
    if(raw.toLowerCase() === 'logo'){
      D.flVariant = 'L';
      D.flText    = '';
    } else if(p.flProduct !== undefined && p.flProduct !== null){
      D.flVariant = 'P';
      D.flText    = raw;
    } else {
      D.flVariant = 'T';
      D.flText    = raw;
    }
  }

  /* logo2：版型L使用。
     這裡刻意「不要」在載入 p.logo2 之後 return——舊寫法 return 會導致同一個
     BN_UPDATE 訊息裡如果剛好也帶了 flProduct（broadcastFull 每次都兩個一起送），
     商品圖那段程式碼直接被跳過、完全沒機會執行，商品圖因此可能「有時候套不上」。
     改成每個欄位各自獨立處理、各自需要非同步載入的就各自在載入完成後 render()，
     不會互相卡住。 */
  if(p.logo2Shape !== undefined) D.logo2Shape = p.logo2Shape;
  if(p.logo2Scale !== undefined) D.logo2Scale = p.logo2Scale;
  if(p.logo2OffX  !== undefined) D.logo2OffX  = p.logo2OffX;
  if(p.logo2OffY  !== undefined) D.logo2OffY  = p.logo2OffY;

  var needsSyncRender = true; // 沒有任何非同步載入時，最後統一 render() 一次

  /* 原圖＋縮放位移：優先用這組直接算，才能跟 Logo2 編輯畫布1:1對應
     （放大就放大、偏左偏右就偏左偏右），細節見 drawVariantL()。 */
  if(p.logo2Raw !== undefined && p.logo2Raw && p.logo2Raw !== D._logo2RawCacheSrc){
    D._logo2RawCacheSrc = p.logo2Raw;
    needsSyncRender = false;
    loadImg(p.logo2Raw, function(img){
      D.logo2RawImg = img;
      D.logo2Bounds = img ? (calcTightBounds(img) || { x:0, y:0, w:img.naturalWidth, h:img.naturalHeight }) : null;
      render();
    });
  }

  /* 合成好的白底小卡：沒有原圖資訊時的備援畫法用（見 drawVariantL） */
  if(p.logo2 !== undefined && p.logo2 && p.logo2 !== D._logo2CacheSrc){
    D._logo2CacheSrc = p.logo2;
    needsSyncRender = false;
    loadImg(p.logo2, function(img){ D.logo2 = img; render(); });
  }

  /* flProduct：版型P使用，值是 product1/2/3 的 dataUrl */
  if(p.flProduct !== undefined){
    if(p.flProduct){
      needsSyncRender = false;
      loadImg(p.flProduct, function(img){ D.flProduct = img; render(); });
    } else {
      D.flProduct = null;
    }
  }

  if(needsSyncRender) render();
});

/* ── BN_READY：通知 editor 這個 iframe 已就緒 ── */
window.parent.postMessage({ type: 'BN_READY' }, '*');

/* ── Export ── */
function exportBlob(fmt, q, cb){
  var out = document.createElement('canvas');
  out.width = W; out.height = H;
  /* 保留透明底：不預填白色，直接合成 */
  out.getContext('2d').drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, W, H);
  out.toBlob(cb, 'image/png'); // FL icon 永遠輸出 PNG（有透明底）
}
</script>
</body>
</html>
